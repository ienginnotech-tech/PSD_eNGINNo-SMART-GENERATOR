<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PSD eNGINNo | SMART GENERATOR</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0d0d0f;--sidebar:#111115;--sidebar2:#16161b;
  --surface:#16161b;--surface2:#1c1c23;
  --border:rgba(255,140,0,.12);--border2:rgba(255,140,0,.22);
  --accent:#ff8c00;--accent2:#e67e00;--accent-glow:rgba(255,140,0,.18);
  --green:#22c55e;--amber:#ff8c00;--rose:#f85149;--purple:#a78bfa;
  --text:#f0ede8;--text2:#8a8580;--text3:#3a3830;
  --card:#16161b;--r:4px;--r2:3px;
  --shadow:0 4px 24px rgba(0,0,0,.6);
  --font:'Courier New',Courier,monospace;
  --sidebar-w:240px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font-family:var(--font)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ===== LOGIN ===== */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:8px;
  padding:32px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.login-header{text-align:center;margin-bottom:20px}
.login-logo-icon{margin:0 auto 14px;font-size:90px;line-height:1}
.login-logo{font-size:22px;font-weight:800;color:var(--accent);letter-spacing:.5px;margin-bottom:2px}
.login-sub{font-size:12px;color:var(--text2);margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.label-th{display:block;text-transform:none;color:#c9a876;font-size:11px;margin-top:2px;letter-spacing:normal}
.field input,.field select{width:100%;padding:10px 12px;background:var(--surface2);
  border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:40px}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;
  cursor:pointer;font-size:16px;color:var(--text2);padding:4px}
.pw-toggle:hover{color:var(--accent)}
.btn{background:var(--accent);color:#0d0d0f;border:none;padding:11px 18px;border-radius:var(--r);
  font-weight:700;cursor:pointer;font-size:13px;letter-spacing:.3px;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn.small{padding:6px 12px;font-size:12px}
.err-msg{color:var(--rose);font-size:12px;margin-top:10px}

/* ===== APP SHELL ===== */
#appShell{display:none;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--sidebar);border-right:1px solid var(--border);
  position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50}
.brand{padding:20px 18px;border-bottom:1px solid var(--border)}
.brand-title{font-size:16px;font-weight:800;color:var(--accent)}
.brand-sub{font-size:10px;color:var(--text2);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);
  color:var(--text2);cursor:pointer;font-size:11px;margin-bottom:2px;position:relative}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-glow);color:var(--accent)}
.user-box{padding:14px 18px;border-top:1px solid var(--border)}
.user-name{font-size:12px;font-weight:700}
.user-role{font-size:10px;color:var(--accent);margin-top:2px}
.logout-btn{font-size:11px;color:var(--text2);background:none;border:none;cursor:pointer;margin-top:8px}
.logout-btn:hover{color:var(--rose)}

.main{margin-left:var(--sidebar-w);padding:24px;max-width:1400px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-title{font-size:20px;font-weight:800}
.page-desc{font-size:12px;color:var(--text2);margin-top:2px}
.header-building-badge{background:var(--surface2);border:1px solid var(--border2);border-radius:20px;
  padding:8px 16px;font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap}

.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}

table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--surface2);color:var(--accent);text-align:left;padding:8px 10px;
  border-bottom:2px solid var(--border2);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:hover td{background:var(--surface2)}
.table-wrap{overflow-x:auto;max-height:65vh;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r)}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.stat-card{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:16px}
.stat-num{font-size:26px;font-weight:800;color:var(--accent)}
.stat-label{font-size:11px;color:var(--text2);margin-top:4px}

.tr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tr-block{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:8px 10px;font-size:12px}
.tr-block-title{font-weight:600;margin-bottom:4px;color:var(--text2)}
.tr-count{font-weight:400;color:var(--text2)}
.tr-block-row{margin-top:2px}
.tr-empty{color:var(--text2);font-style:italic}
@media (max-width:520px){.tr-grid{grid-template-columns:1fr}}
.gen-card{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:14px;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.gen-name{font-weight:700;font-size:13px}
.gen-meta{font-size:11px;color:var(--text2);margin-top:3px}
.tag{display:inline-block;padding:2px 8px;border:1px solid var(--border2);border-radius:12px;font-size:10px;color:var(--accent)}

.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.qr-box{background:#fff;padding:10px;border-radius:6px;display:inline-block}
.hidden{display:none !important}
.badge{background:var(--rose);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px}
.loading{color:var(--text2);font-size:12px;padding:20px;text-align:center}

#qrReader{width:100%;max-width:400px;margin:0 auto}

.tank-card{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:14px 14px 32px;margin-bottom:10px;position:relative}
.tank-card.big{padding:18px 18px 36px}
.tank-brand-tag{position:absolute;bottom:10px;right:12px;font-size:10px;color:var(--text2);
  background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:2px 8px;font-weight:700}
.tank-inspector{font-size:11px;color:var(--text2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}

/* ถังน้ำมันแบบมีของเหลวเคลื่อนไหว (ใช้กับ Store Tank) */
.tank-visual-wrap{display:flex;align-items:center;gap:14px;margin-top:10px}
.tank-visual{width:56px;height:100px;border:2px solid var(--border2);border-radius:8px 8px 4px 4px;
  position:relative;overflow:hidden;background:var(--surface);flex-shrink:0}
.tank-visual-liquid{position:absolute;bottom:0;left:0;right:0;transition:height .8s ease}
.tank-visual-wave{position:absolute;top:-5px;left:0;width:200%;height:10px;background:inherit;
  border-radius:45%;animation:tankWaveMove 3.2s linear infinite;opacity:.55}
@keyframes tankWaveMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tank-visual-pct{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:10px;color:var(--text);
  font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tank-group{margin-top:6px;padding-top:14px;border-top:1px dashed var(--border)}
.tank-group:first-of-type{border-top:none;padding-top:0;margin-top:0}
.tank-group-title{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:10px;
  display:flex;align-items:baseline;gap:8px}
.tank-group-count{font-size:11px;color:var(--text2);font-weight:400}
.tank-name{font-weight:700;font-size:13px}
.tank-sub{font-size:11px;color:var(--text2);margin-top:2px}
.tank-bar-bg{background:var(--surface);border-radius:6px;height:10px;margin-top:10px;overflow:hidden;border:1px solid var(--border)}
.tank-bar-fill{height:100%;border-radius:6px;transition:.3s}
.gauge-wrap{position:relative;height:14px;margin-top:12px}
.gauge-zones{display:flex;height:100%;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.gauge-zone{height:100%}
.gauge-marker{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;
  box-shadow:0 0 4px rgba(0,0,0,.8);transform:translateX(-50%);border-radius:2px}
.gauge-ticks{position:relative;height:14px;margin-top:2px}
.gauge-tick{position:absolute;transform:translateX(-50%);font-size:9px;color:var(--text2)}

@keyframes blinkSlow{0%,100%{border-color:var(--amber);box-shadow:0 0 0 rgba(255,140,0,0)}50%{border-color:#ffb84d;box-shadow:0 0 12px rgba(255,140,0,.65)}}
@keyframes blinkFast{0%,100%{border-color:var(--rose);box-shadow:0 0 0 rgba(248,81,73,0)}50%{border-color:#ff6b63;box-shadow:0 0 16px rgba(248,81,73,.85)}}
@keyframes blinkTextSlow{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes blinkTextFast{0%,100%{opacity:1}50%{opacity:.3}}
.blink-slow{animation:blinkSlow 1.8s ease-in-out infinite}
.blink-fast{animation:blinkFast 0.7s ease-in-out infinite}
.blink-text-slow{animation:blinkTextSlow 1.8s ease-in-out infinite}
.blink-text-fast{animation:blinkTextFast 0.7s ease-in-out infinite}
.tank-nums{display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-top:5px}
.status-badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700;margin-left:8px}
.status-ok{background:rgba(34,197,94,.15);color:var(--green)}
.status-warn{background:rgba(255,140,0,.15);color:var(--amber)}
.status-danger{background:rgba(248,81,73,.15);color:var(--rose)}
.status-shared{background:rgba(167,139,250,.15);color:var(--purple)}
.shared-note{font-size:11px;color:var(--text2);margin-top:8px;padding:8px 10px;
  background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.25);border-radius:6px}
.shared-link{color:var(--purple);cursor:pointer;text-decoration:underline;font-weight:700;margin:0 2px}
@keyframes flashHighlight{0%,100%{box-shadow:0 0 0 rgba(167,139,250,0)}50%{box-shadow:0 0 0 3px rgba(167,139,250,.9)}}
.flash-highlight{animation:flashHighlight 0.8s ease-in-out 2}
.alert-row{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.3);border-radius:6px;
  padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filter-bar select{padding:8px 10px;background:var(--surface2);border:1px solid var(--border2);
  border-radius:var(--r);color:var(--text);font-size:12px;min-width:140px}
.chart-wrap{position:relative;height:320px}

/* SOP Flow diagram */
.flow-root{margin-left:0}
.flow-node{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;
  padding:12px 14px;margin-bottom:10px;position:relative}
.flow-node-title{font-weight:700;font-size:13px}
.flow-node-desc{font-size:11px;color:var(--text2);margin-top:4px}
.flow-node-link{display:inline-block;margin-top:8px;font-size:11px;color:var(--accent);
  border:1px solid var(--accent);border-radius:12px;padding:3px 10px;cursor:pointer;font-weight:700}
.flow-node-link:hover{background:var(--accent-glow)}
.flow-children{margin-left:22px;padding-left:16px;border-left:2px dashed var(--border2);margin-top:8px}

/* Register link on login screen */
.auth-switch{text-align:center;margin-top:14px;font-size:12px;color:var(--text2)}
.auth-switch a{color:var(--accent);cursor:pointer;text-decoration:underline}

/* Sidebar gear + brand row */
.brand{padding:20px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.gear-btn{background:transparent;border:1px solid var(--border2);color:var(--text2);width:28px;height:28px;
  border-radius:var(--r);cursor:pointer;font-size:13px;flex-shrink:0}
.gear-btn:hover{color:var(--accent);border-color:var(--accent)}

/* Grouped nav sections */
.nav-section-label{display:flex;align-items:center;gap:6px;font-size:13px;letter-spacing:1px;color:var(--text);
  text-transform:uppercase;padding:14px 12px 4px;font-weight:800}
.nav-section-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* Global clock top-right */
#headerClock{text-align:right;font-size:11px;color:var(--text2);line-height:1.5;white-space:nowrap}
#clockDate{color:var(--accent);font-weight:700;font-size:12px}

/* Settings page */
.theme-swatch{border:2px solid var(--border2);border-radius:8px;padding:16px;cursor:pointer;text-align:center;transition:.15s}
.theme-swatch.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.theme-swatch-bar{height:40px;border-radius:6px;margin-bottom:10px}
.option-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:10px}

/* User management table actions */
.user-actions button{margin-right:6px}
.user-status-pending{color:var(--amber)}
.user-status-approved{color:var(--green)}
.user-status-rejected{color:var(--rose)}

.sig-pad-wrap{border:1px dashed var(--border2);border-radius:6px;background:#1a1a1f;display:inline-block}
.sig-pad-wrap canvas{display:block;touch-action:none;cursor:crosshair;border-radius:6px}

.sidebar.compact{width:64px}
.sidebar.compact .brand-sub,
.sidebar.compact .brand-title,
.sidebar.compact .nav-item span:last-child,
.sidebar.compact .nav-section-label,
.sidebar.compact .user-name,
.sidebar.compact .user-role,
.sidebar.compact .logout-btn{display:none}
.sidebar.compact .nav-item{justify-content:center}
.sidebar.compact ~ .main{margin-left:64px}
.sidebar.compact .brand{justify-content:center}
.sidebar.compact .gear-btn{display:none}

@media (max-width:820px){
  .sidebar{transform:translateX(-100%);transition:.2s;width:220px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:16px}
  #menuBtn{display:block !important}
  .form-grid{grid-template-columns:1fr}
}
#menuBtn{display:none;background:var(--surface2);border:1px solid var(--border2);color:var(--text);
  padding:8px 12px;border-radius:var(--r);cursor:pointer;margin-bottom:10px}
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen">
  <div class="login-card" id="loginCard">
    <div class="login-header">
      <div class="login-logo-icon">⚡</div>
      <div class="login-logo">PSD eNGINNo</div>
      <div class="login-sub">SMART GENERATOR MANAGEMENT SYSTEM</div>
    </div>
    <div class="field">
      <label>ชื่อผู้ใช้ (Username)</label>
      <input id="loginModuleKey" placeholder="ชื่อผู้ใช้" autocomplete="off">
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input id="loginPassword" type="password" placeholder="รหัสผ่าน">
        <button type="button" class="pw-toggle" onclick="togglePw_('loginPassword', this)">👁️</button>
      </div>
    </div>
    <button class="btn block" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div id="loginErr" class="err-msg hidden"></div>
    <div class="auth-switch">ยังไม่มีบัญชี? <a onclick="showRegister()">ลงทะเบียนที่นี่</a></div>
  </div>

  <div class="login-card hidden" id="registerCard">
    <div class="login-header">
      <div class="login-logo-icon">📝</div>
      <div class="login-logo">ลงทะเบียนผู้ใช้ใหม่</div>
      <div class="login-sub">กรอกข้อมูลแล้วรอผู้ดูแลระบบอนุมัติก่อนเข้าใช้งาน</div>
    </div>
    <div class="field">
      <label>ชื่อ-นามสกุล / ชื่อที่แสดง</label>
      <input id="regDisplayName" placeholder="เช่น สมชาย ใจดี">
    </div>
    <div class="field">
      <label>อาคารที่สังกัด</label>
      <select id="regBuilding">
        <option value="">— เลือกอาคาร —</option>
        <option value="BITEC I">BITEC I</option>
        <option value="BITEC II">BITEC II</option>
        <option value="BTB">BTB</option>
        <option value="BTE">BTE</option>
        <option value="UBC II">UBC II</option>
        <option value="SL-P1">Summer LaSalle - P1</option>
        <option value="SL-Campus A">Summer LaSalle - Campus A</option>
        <option value="S23-Gen room">S23</option>
      </select>
    </div>
    <div class="field">
      <label>Username (ตั้งเอง)</label>
      <input id="regModuleKey" placeholder="เช่น somchai01" autocomplete="off">
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input id="regPassword" type="password" placeholder="อย่างน้อย 4 ตัวอักษร">
        <button type="button" class="pw-toggle" onclick="togglePw_('regPassword', this)">👁️</button>
      </div>
    </div>
    <button class="btn block" onclick="doRegister()">ส่งคำขอลงทะเบียน</button>
    <div id="registerErr" class="err-msg hidden"></div>
    <div id="registerOk" class="hidden" style="color:var(--green);font-size:12px;margin-top:10px"></div>
    <div class="auth-switch">มีบัญชีอยู่แล้ว? <a onclick="showLogin()">เข้าสู่ระบบ</a></div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appShell">
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div>
        <div class="brand-title">⚡ PSD_eNGINNo</div>
        <div class="brand-sub">SMART GENERATOR</div>
      </div>
      <button class="gear-btn" onclick="navigate('settings')" title="ตั้งค่า">⚙️</button>
    </div>
    <div class="nav" id="navList"></div>
    <div class="user-box">
      <div class="user-name" id="userName">-</div>
      <div class="user-role" id="userRole">-</div>
      <button class="logout-btn" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </div>

  <div class="main">
    <button id="menuBtn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ เมนู</button>
    <div id="pageContent"></div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG - แก้ API_URL เป็น URL ของ Web App ที่ deploy จาก Code.gs
   (ถ้าไฟล์นี้ถูก deploy เป็น HtmlService ของ Apps Script เอง สามารถ
    ปล่อยว่างไว้ ระบบจะเรียก google.script.run แทนอัตโนมัติ)
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwySzO68d7aBFdEEK8h3LTrzT07X3G7onC-QtZczWgOdUDDpnOyD0JlX_CUusPN8DjP/exec';
// อ่าน ?genid=xxx ตรงจาก URL เสมอ (ทำงานได้ทั้งบน Apps Script และ GitHub Pages/hosting อื่น)
const PRELOAD_GENID = new URLSearchParams(window.location.search).get('genid') || '';

let SESSION = null;
let CURRENT_PAGE = 'dashboard';

/* ---------- API CALLER (รองรับทั้ง fetch ไป Web App URL และ google.script.run) ---------- */
function callApi(action, data) {
  data = data || {};
  if (SESSION) data.session = SESSION;

  const apiPromise = new Promise((resolve, reject) => {
    if (API_URL) {
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action, data })
      }).then(r => r.json()).then(resolve).catch(reject);
    } else if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(str => { try { resolve(JSON.parse(str)); } catch(e) { reject(e); } })
        .withFailureHandler(reject)
        .callFromClient(JSON.stringify({ action, data }));
    } else {
      reject(new Error('ไม่พบช่องทางเชื่อมต่อ backend (ตั้งค่า API_URL)'));
    }
  });

  // Safety net: ถ้าไม่มีการตอบกลับภายใน 25 วินาที (เช่น หลายอาคารเข้าใช้พร้อมกันจน Apps Script คิวยาว)
  // ให้ reject ออกมาแสดง error แทนที่จะค้างหน้า "กำลังโหลด..." ไปตลอด
  const timeoutPromise = new Promise((_, reject) => {
    setTimeout(() => reject(new Error('การเชื่อมต่อใช้เวลานานเกินไป (อาจมีผู้ใช้งานพร้อมกันหลายคน) กรุณาลองใหม่')), 25000);
  });

  return Promise.race([apiPromise, timeoutPromise]);
}

    options += `<option value="${escAttr(t.name)}">${escHtml(t.name)} (${escHtml(t.position)})</option>`;

// ===== ลายเซ็นต์ (Signature Pad) - ใช้ร่วมกันทั้ง Daily Check / Weekly / Annual =====
function initSignaturePad_(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || canvas.dataset.initialized) return;
  canvas.dataset.initialized = '1';
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#f0ede8';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let drawing = false;

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: cx * (canvas.width / rect.width), y: cy * (canvas.height / rect.height) };
  }
  function start(e) { drawing = true; canvas.dataset.hasSig = '1'; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e) { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
  function end() { drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
}
function clearSignature_(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  canvas.dataset.hasSig = '';
}
function signaturePadHtml_(canvasId, width, height) {
  return `<div class="field" style="margin-top:14px">
    <label>ลงลายเซ็นต์</label>
    <div class="sig-pad-wrap"><canvas id="${canvasId}" width="${width}" height="${height}"></canvas></div>
    <button type="button" class="btn small ghost" style="margin-top:8px" onclick="clearSignature_('${canvasId}')">🗑️ ล้างลายเซ็นต์</button>
  </div>`;
}

function startClock_() {
  function tick() {
    const now = new Date();
    const dateStr = now.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'Asia/Bangkok' });
    const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Asia/Bangkok' });
    const d = document.getElementById('clockDate'); if (d) d.textContent = dateStr;
    const t = document.getElementById('clockTime'); if (t) t.textContent = timeStr;
  }
  tick();
  setInterval(tick, 1000);
}

// การ์ด Day Tank เฉพาะอาคารของบัญชีที่ login อยู่ (ใช้ในหน้า Storage Fuel Control ให้เห็นถังของอาคารตัวเองด้วย)
function renderDayTankCardsForSession_(tankRes) {
  if (!tankRes.ok || !(tankRes.rows || []).length) return '';
  const rows = tankRes.rows;
  const keys = Object.keys(rows[0]).filter(k => k !== '_row');
  const buildingKey = keys.find(k => /building|อาคาร/i.test(k));
  const nameKey = keys.find(k => /generator no|name|ชื่อ/i.test(k));
  const fullKey = keys.find(k => /^full/i.test(k));
  const actualKey = keys.find(k => /actual/i.test(k));
  const ropKey = keys.find(k => /rop/i.test(k));
  const noteKey = keys.find(k => /หมายเหตุ|^note/i.test(k));

  const storeTanks = rows.filter(r => /store\s*tank/i.test(String(r[nameKey] || r[buildingKey] || '')));
  let dayTanks = rows.filter(r => !storeTanks.includes(r));

  if (SESSION && SESSION.role !== 'admin' && SESSION.buildingCode !== 'ALL') {
    const codes = String(SESSION.buildingCode).split(',').map(s => s.trim());
    dayTanks = dayTanks.filter(r => codes.includes(String(r[buildingKey] || '').trim()));
  }
  if (!dayTanks.length) return '';

  const statusLabelD = { ok: '🟢 ปกติ', warn: '🟠 ต้องสั่งเติม', critical: '🔴 ต้องสั่งเติมด่วนที่สุด', shared: '🔗 ใช้ถังร่วม' };
  const statusClassD = { ok: 'status-ok', warn: 'status-warn', critical: 'status-danger', shared: 'status-shared' };

  return `<div class="grid-cards">${dayTanks.map(r => {
    const full = parseFloat(r[fullKey]) || 0;
    const actual = parseFloat(r[actualKey]);
    const note = noteKey ? String(r[noteKey] || '').trim() : '';
    const name = r[nameKey] || r[buildingKey] || '-';
    if ((!full || full <= 0) && note) {
      return `<div class="tank-card"><div class="tank-name">${escHtml(name)} <span class="status-badge ${statusClassD.shared}">${statusLabelD.shared}</span></div>
        <div class="tank-sub">${escHtml(r[buildingKey] || '')}</div><div class="shared-note">📌 ${escHtml(note)}</div></div>`;
    }
    const pct = full > 0 && !isNaN(actual) ? (actual / full) * 100 : null;
    const st = statusOfPct(pct, false);
    const visualColor = st === 'critical' ? '#f85149' : (st === 'warn' ? '#ff8c00' : (pct !== null && pct >= 80 ? '#2563eb' : '#22c55e'));
    const inspector = tankInspectorName_(r[buildingKey], false);
    return `<div class="tank-card">
      <div class="tank-name">${escHtml(name)} <span class="status-badge ${statusClassD[st]}">${statusLabelD[st]}</span></div>
      <div class="tank-sub">${escHtml(r[buildingKey] || '')}</div>
      <div class="tank-visual-wrap">${renderTankVisual_(pct, visualColor)}<div style="flex:1">${buildGaugeHtml_(full, actual, false)}</div></div>
      <div class="tank-nums" style="margin-top:6px"><span>คงเหลือ: ${isNaN(actual) ? '-' : actual.toLocaleString()} L</span><span>เต็ม: ${full.toLocaleString()} L</span></div>
      ${ropKey ? `<div class="tank-nums"><span>ROP: ${r[ropKey]}</span><span></span></div>` : ''}
      ${inspector ? `<div class="tank-inspector">👤 ผู้ตรวจสอบล่าสุด: ${escHtml(inspector)}</div>` : ''}
    </div>`;
  }).join('')}</div>`;
}

// สร้างการ์ด Store Tank เดี่ยวๆ (ไม่รวม Day Tank/alerts) สำหรับใช้ในหน้าอื่นนอกจาก Dashboard เช่นหน้า Storage Fuel Control
function renderStoreTankCardsOnly_(tankRes) {
  if (!tankRes.ok || !(tankRes.rows || []).length) return '<div class="loading">ไม่มีข้อมูลถังสำรอง</div>';
  const rows = tankRes.rows;
  const keys = Object.keys(rows[0]).filter(k => k !== '_row');
  const buildingKey = keys.find(k => /building|อาคาร/i.test(k));
  const nameKey = keys.find(k => /generator no|name|ชื่อ/i.test(k));
  const fullKey = keys.find(k => /^full/i.test(k));
  const actualKey = keys.find(k => /actual/i.test(k));
  const ropKey = keys.find(k => /rop/i.test(k));

  const storeTanks = rows.filter(r => /store\s*tank/i.test(String(r[nameKey] || r[buildingKey] || '')));
  if (!storeTanks.length) return '<div class="loading">ไม่พบ Store Tank</div>';

  const statusLabel = { ok: '🟢 ปกติ', warn: '🟠 ต้องสั่งเติม' };
  const statusClass = { ok: 'status-ok', warn: 'status-warn' };

  return `<div class="grid-cards">${storeTanks.map(r => {
    const full = parseFloat(r[fullKey]) || 0;
    const actual = parseFloat(r[actualKey]);
    const pct = full > 0 && !isNaN(actual) ? (actual / full) * 100 : null;
    const st = statusOfPct(pct, true);
    const visualColor = st === 'warn' ? '#ff8c00' : (pct !== null && pct >= 80 ? '#2563eb' : '#22c55e');
    const name = r[nameKey] || r[buildingKey] || '-';
    return `<div class="tank-card big">
      <div class="tank-name">${escHtml(name)} <span class="status-badge ${statusClass[st]}">${statusLabel[st]}</span></div>
      <div class="tank-sub">${escHtml(r[buildingKey] || '')}</div>
      <div class="tank-visual-wrap">${renderTankVisual_(pct, visualColor)}<div style="flex:1">${buildGaugeHtml_(full, actual, true)}</div></div>
      <div class="tank-nums" style="margin-top:6px">
        <span>คงเหลือ: ${isNaN(actual) ? '-' : actual.toLocaleString()} L</span>
        <span>เต็ม: ${full.toLocaleString()} L</span>
      </div>
      ${ropKey ? `<div class="tank-nums"><span>ROP: ${r[ropKey]}</span><span></span></div>` : ''}
      <div class="tank-inspector">👤 ผู้ตรวจสอบล่าสุด: ${escHtml(STORAGE_TANK_INSPECTOR)}</div>
    </div>`;
  }).join('')}</div>`;
}

/* ---- Fuel Tank section ---- */
function scrollToTank_(code) {
  // ค้นหาแบบ "มีคำนี้อยู่ในรหัส" แทนการเทียบตรงเป๊ะ เพราะหมายเหตุอาจพิมพ์แบบย่อ
  // (เช่น "GEN-08") แต่รหัสจริงมี prefix อาคารนำหน้า (เช่น "BITEC-II-GEN-08")
  const candidates = Array.from(document.querySelectorAll('[data-code]'));
  const target = candidates.find(el => {
    const c = (el.dataset.code || '').toUpperCase();
    return c && c.includes(code.toUpperCase());
  });
  if (!target) {
    alert('ไม่พบการ์ดของ ' + code + ' ในหน้านี้ (อาจต้องเลื่อนหาด้วยตาเอง หรือเครื่องไม่มีการ์ดแสดงคงเหลือ)');
    return;
  }
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.classList.add('flash-highlight');
  setTimeout(() => target.classList.remove('flash-highlight'), 1700);
}

const BUILDING_ORDER_ = ['BITEC I', 'BITEC II', 'BTB', 'BTE', 'UBC II', 'Summer LaSalle', 'S23'];

// สร้างภาพถังน้ำมันมีของเหลวเคลื่อนไหว ใช้กับ Store Tank (ทั้ง Dashboard และหน้า Storage Fuel Control)
function renderTankVisual_(pct, color) {
  const h = pct === null ? 0 : Math.max(0, Math.min(100, pct));
  return `<div class="tank-visual">
    <div class="tank-visual-pct">${pct === null ? '-' : Math.round(h) + '%'}</div>
    <div class="tank-visual-liquid" style="height:${h}%;background:${color}">
      <div class="tank-visual-wave"></div>
    </div>
  </div>`;
}
function buildingSortIndex_(building) {
  const idx = BUILDING_ORDER_.indexOf(displayGroupLabel_(building));
  return idx === -1 ? 999 : idx;
}
// รวม SL-P1 กับ SL-Campus A ไว้กลุ่มเดียวกัน (Summer LaSalle) แทนแยกหัวข้อ กันเปลืองพื้นที่เวลามีแค่เครื่องเดียวต่อกลุ่ม
const DISPLAY_GROUP_MAP_ = { 'SL-P1': 'Summer LaSalle', 'SL-Campus A': 'Summer LaSalle', 'S23-Gen room': 'S23' };
function displayGroupLabel_(building) {
  return DISPLAY_GROUP_MAP_[building] || building;
}

// เกณฑ์ตายตัว: Store Tank = 3 โซน (ส้ม<50% / เขียว50-80% / ฟ้า80-100%)
//             เครื่องแต่ละอาคาร = 4 โซน (แดง<40% / ส้ม40-50% / เขียว50-80% / ฟ้า80-100%)
function statusOfPct(pct, isStore) {
  if (pct === null) return 'ok';
  if (isStore) return pct < 50 ? 'warn' : 'ok';
  if (pct < 40) return 'critical';
  if (pct < 50) return 'warn';
  return 'ok';
}

function buildGaugeHtml_(full, actual, isStore) {
  if (!full || full <= 0) return '<div class="tank-sub">ไม่มีข้อมูลความจุ (Full Capacity)</div>';
  const zones = isStore
    ? [{ w: 50, color: '#ff8c00' }, { w: 30, color: '#22c55e' }, { w: 20, color: '#2563eb' }]
    : [{ w: 40, color: '#f85149' }, { w: 10, color: '#ff8c00' }, { w: 30, color: '#22c55e' }, { w: 20, color: '#2563eb' }];
  const ticks = isStore ? [50, 80] : [40, 50, 80];

  const zonesHtml = zones.map(z => `<div class="gauge-zone" style="width:${z.w}%;background:${z.color}"></div>`).join('');
  const ticksHtml = ticks.map(t => `<span class="gauge-tick" style="left:${t}%">${t}%</span>`).join('');
  const pct = isNaN(actual) ? null : Math.max(0, Math.min(100, (actual / full) * 100));
  const marker = pct !== null ? `<div class="gauge-marker" style="left:${pct}%" title="คงเหลือ ${actual}"></div>` : '';

  return `<div class="gauge-wrap"><div class="gauge-zones">${zonesHtml}</div>${marker}</div>
    <div class="gauge-ticks">${ticksHtml}</div>`;
}

function renderFuelTankDashboard_(tankRes, genRes) {
  if (!tankRes.ok || !(tankRes.rows || []).length) {
    return `<div class="card"><div class="card-title">สถานะถังเชื้อเพลิง</div><div class="loading">ไม่มีข้อมูล</div></div>`;
  }
  const rows = tankRes.rows;
  const keys = Object.keys(rows[0]).filter(k => k !== '_row');
  const buildingKey = keys.find(k => /building|อาคาร/i.test(k));
  const nameKey = keys.find(k => /generator no|name|ชื่อ/i.test(k));
  const codeKey = keys.find(k => /^code/i.test(k) && !/machine/i.test(k));
  const fullKey = keys.find(k => /^full/i.test(k));
  const actualKey = keys.find(k => /actual/i.test(k));
  const ropKey = keys.find(k => /rop/i.test(k));
  const noteKey = keys.find(k => /หมายเหตุ|^note/i.test(k));

  // สร้าง map รหัสเครื่อง -> ป้ายยี่ห้อ+ขนาด (เช่น "CATERPILLAR-1400kVA") จากทะเบียนเครื่อง (Generator Specification)
  // ใช้ regex เข้มงวด (ต้องขึ้นต้นด้วยคำนี้เป๊ะๆ) กันจับคอลัมน์อื่นผิดโดยไม่ตั้งใจ
  const BRAND_MAP = {};
  if (genRes && genRes.ok && (genRes.rows || []).length) {
    const gRows = genRes.rows;
    const gKeys = Object.keys(gRows[0]).filter(k => k !== '_row');
    const gCodeKey = gKeys.find(k => /^code/i.test(k.trim()) && !/machine/i.test(k));
    const brandKey = gKeys.find(k => /^(brand|ยี่ห้อ)\b/i.test(k.trim()));
    const capacityKey = gKeys.find(k => /capacity/i.test(k) && !/full|80\s*%|fuel|storage|litre|liter/i.test(k));
    if (gCodeKey) {
      gRows.forEach(r => {
        const code = r[gCodeKey];
        if (!code) return;
        const brand = brandKey ? String(r[brandKey] || '').trim() : '';
        const capRaw = capacityKey ? String(r[capacityKey] || '').trim() : '';
        const cap = capRaw.replace(/kva/i, '').trim(); // กันกรณีเซลล์มีหน่วยติดมาด้วยอยู่แล้ว
        let label = '';
        if (brand && cap) label = `${brand}-${cap}kVA`;
        else if (brand) label = brand;
        else if (cap) label = `${cap}kVA`;
        if (label) BRAND_MAP[code] = label;
      });
    }
  }

  const statusLabel = { ok: '🟢 ปกติ', warn: '🟠 ต้องสั่งเติม', critical: '🔴 ต้องสั่งเติมด่วนที่สุด', shared: '🔗 ใช้ถังร่วม' };
  const statusClass = { ok: 'status-ok', warn: 'status-warn', critical: 'status-danger', shared: 'status-shared' };
  const blinkClass = { ok: '', warn: 'blink-slow', critical: 'blink-fast', shared: '' };
  const blinkTextClass = { ok: '', warn: 'blink-text-slow', critical: 'blink-text-fast', shared: '' };

  function tankCardHtml(r, big, isStore) {
    const full = parseFloat(r[fullKey]) || 0;
    const actual = parseFloat(r[actualKey]);
    const note = noteKey ? String(r[noteKey] || '').trim() : '';
    const ownCode = codeKey ? r[codeKey] : '';
    const name = r[nameKey] || r[buildingKey] || '-';
    const brandTag = ownCode && BRAND_MAP[ownCode] ? `<div class="tank-brand-tag">${escHtml(BRAND_MAP[ownCode])}</div>` : '';

    // กรณีถังใช้ร่วมกัน (ไม่มี Full capacity ของตัวเอง แต่มีหมายเหตุอ้างอิงเครื่องอื่น)
    if ((!full || full <= 0) && note) {
      const refCodes = [...new Set((note.match(/[A-Z0-9]+-[A-Z0-9-]*\d+/gi) || []))];
      const linksHtml = refCodes.length
        ? refCodes.map(c => `<span class="shared-link" onclick="scrollToTank_('${escAttr(c)}')">${escHtml(c)}</span>`).join(', ')
        : '';
      const inspectorShared = tankInspectorName_(r[buildingKey], isStore);
      return `<div class="tank-card${big ? ' big' : ''}" id="${ownCode ? 'tankcard_' + cssId(ownCode) : ''}" data-code="${escAttr(ownCode)}">
        <div class="tank-name">${escHtml(name)} <span class="status-badge ${statusClass.shared}">${statusLabel.shared}</span></div>
        <div class="tank-sub">${escHtml(r[buildingKey] || '')}</div>
        <div class="shared-note">📌 ${escHtml(note)}${linksHtml ? '<br>ดูถังจริงที่: ' + linksHtml : ''}</div>
        ${inspectorShared ? `<div class="tank-inspector">👤 ผู้ตรวจสอบล่าสุด: ${escHtml(inspectorShared)}</div>` : ''}
        ${brandTag}
      </div>`;
    }

    const pct = full > 0 && !isNaN(actual) ? (actual / full) * 100 : null;
    const st = statusOfPct(pct, isStore);
    const visualColor = st === 'critical' ? '#f85149' : (st === 'warn' ? '#ff8c00' : (pct !== null && pct >= 80 ? '#2563eb' : '#22c55e'));
    const tankVisualHtml = `<div class="tank-visual-wrap">${renderTankVisual_(pct, visualColor)}<div style="flex:1">${buildGaugeHtml_(full, actual, isStore)}</div></div>`;
    const inspector = tankInspectorName_(r[buildingKey], isStore);
    return `<div class="tank-card${big ? ' big' : ''} ${blinkClass[st]}" id="${ownCode ? 'tankcard_' + cssId(ownCode) : ''}" data-code="${escAttr(ownCode)}">
      <div class="tank-name">${escHtml(name)} <span class="status-badge ${statusClass[st]} ${blinkTextClass[st]}">${statusLabel[st]}</span></div>
      <div class="tank-sub">${escHtml(r[buildingKey] || '')}</div>
      ${tankVisualHtml}
      <div class="tank-nums" style="margin-top:6px">
        <span>คงเหลือ: ${isNaN(actual) ? '-' : actual.toLocaleString()} L</span>
        <span>เต็ม: ${full.toLocaleString()} L</span>
      </div>
      ${ropKey ? `<div class="tank-nums"><span>ROP: ${r[ropKey]}</span><span></span></div>` : ''}
      ${note ? `<div class="shared-note">📌 ${escHtml(note)}</div>` : ''}
      ${inspector ? `<div class="tank-inspector">👤 ผู้ตรวจสอบล่าสุด: ${escHtml(inspector)}</div>` : ''}
      ${brandTag}
    </div>`;
  }

  const storeTanks = rows.filter(r => /store\s*tank/i.test(String(r[nameKey] || r[buildingKey] || '')));
  const genTanks = rows.filter(r => !storeTanks.includes(r))
    .sort((a, b) => buildingSortIndex_(a[buildingKey]) - buildingSortIndex_(b[buildingKey]));

  function rowStatus_(r, isStore) {
    const full = parseFloat(r[fullKey]) || 0;
    const actual = parseFloat(r[actualKey]);
    const note = noteKey ? String(r[noteKey] || '').trim() : '';
    if ((!full || full <= 0) && note) return { st: 'shared', full, actual, pct: null }; // ถังร่วม ไม่คิดแจ้งเตือนซ้ำ
    const pct = full > 0 && !isNaN(actual) ? (actual / full) * 100 : null;
    return { st: statusOfPct(pct, isStore), full, actual, pct };
  }

  const alerts = rows.map(r => {
    const isStore = storeTanks.includes(r);
    const info = rowStatus_(r, isStore);
    return { r, isStore, ...info };
  }).filter(x => x.st !== 'ok' && x.st !== 'shared').sort((a, b) => (a.pct ?? 0) - (b.pct ?? 0));

  let html = '<div class="card"><div class="card-title">🛢️ สถานะถังน้ำมันสำรองส่วนกลาง (STORAGE TANK)</div>';
  html += storeTanks.length
    ? `<div class="grid-cards">${storeTanks.map(r => tankCardHtml(r, true, true)).join('')}</div>`
    : '<div class="loading">ไม่พบ Store Tank</div>';
  html += '</div>';

  if (alerts.length) {
    const hasCritical = alerts.some(a => a.st === 'critical');
    const titleBlink = hasCritical ? 'blink-text-fast' : 'blink-text-slow';
    html += `<div class="card ${hasCritical ? 'blink-fast' : 'blink-slow'}">
      <div class="card-title ${titleBlink}" style="color:var(--rose)">🔴 ต้องสั่งซื้อเชื้อเพลิงด่วน (${alerts.length} รายการ)</div>`;
    alerts.forEach(a => {
      const target = a.full * 0.8; // เป้าหมายเติมกลับไปที่ 80% ของความจุ
      const need = Math.max(0, target - a.actual);
      const rowBlink = a.st === 'critical' ? 'blink-text-fast' : 'blink-text-slow';
      html += `<div class="alert-row ${a.st === 'critical' ? 'blink-fast' : 'blink-slow'}">
        <div><b>${escHtml(a.r[buildingKey] || '')}</b> — ${escHtml(a.r[nameKey] || '')}
          <span class="status-badge ${a.st === 'critical' ? 'status-danger' : 'status-warn'} ${rowBlink}">
            ${a.st === 'critical' ? '🔴 ด่วนที่สุด' : '🟠 ต้องสั่งเติม'}</span></div>
        <div style="font-size:12px">คงเหลือ ${a.actual.toLocaleString()} L (${a.pct.toFixed(0)}%)
          <span style="color:var(--rose)"> · ต้องเติมประมาณ ${need.toLocaleString(undefined,{maximumFractionDigits:0})} L ให้ถึง 80%</span></div>
      </div>`;
    });
    html += '</div>';
  }

  // จัดกลุ่มการ์ด Day Tank แยกตามอาคาร เรียงตาม BUILDING_ORDER_ แต่ละกลุ่มมีหัวข้อกำกับชัดเจน กันตาลาย
  // (SL-P1 กับ SL-Campus A ถูกรวมไว้กลุ่มเดียวกัน "Summer LaSalle" ผ่าน displayGroupLabel_)
  const buildingGroups = {};
  const buildingGroupOrder = [];
  genTanks.forEach(r => {
    const b = displayGroupLabel_(r[buildingKey] || 'อื่นๆ');
    if (!buildingGroups[b]) { buildingGroups[b] = []; buildingGroupOrder.push(b); }
    buildingGroups[b].push(r);
  });
  buildingGroupOrder.sort((a, b) => buildingSortIndex_(a) - buildingSortIndex_(b));

  html += `<div class="card"><div class="card-title">สถานะถังน้ำมันประจำเครื่อง (DAY TANK)</div>`;
  buildingGroupOrder.forEach(b => {
    html += `<div class="tank-group">
      <div class="tank-group-title">${escHtml(b)} <span class="tank-group-count">(${buildingGroups[b].length} เครื่อง)</span></div>
      <div class="grid-cards">${buildingGroups[b].map(r => tankCardHtml(r, false, false)).join('')}</div>
    </div>`;
  });
  html += `</div>`;

  return html;
}

/* ---- Repair cost chart section ---- */
function renderRepairCostSection_(repairRes) {
  if (!repairRes.ok || !(repairRes.rows || []).length) {
    return `<div class="card"><div class="card-title">ค่าใช้จ่ายซ่อมบำรุง</div><div class="loading">ไม่มีข้อมูล</div></div>`;
  }

    <div class="card-title">📊 วิเคราะห์ค่าใช้จ่ายซ่อมบำรุง</div>

      <select id="filterBuilding" onchange="drawRepairChart_()"></select>

      <select id="filterCompany" onchange="drawRepairChart_()"></select>
      <input id="filterDetail" placeholder="🔍 ค้นหารายละเอียด/อุปกรณ์ที่เปลี่ยน..." style="flex:1;min-width:220px;padding:8px 10px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:12px" oninput="drawRepairChart_()">
    </div>
    <div id="costSummary" style="font-size:12px;color:var(--text2);margin-bottom:10px"></div>

}

function initRepairFilters_(headers) {
  const rows = DASH_REPAIR_ROWS;
  const keys = Object.keys(rows[0]).filter(k => k !== '_row');
  const buildingKey = keys.find(k => /building|อาคาร/i.test(k));
  const typeKey = keys.find(k => /ประเภท|^type/i.test(k));
  const dateKey = keys.find(k => /^date$|วันที่/i.test(k));
  const companyKey = keys.find(k => /ผู้ดำเนินการ|ผู้รับเหมา|ผู้ให้บริการซ่อม/i.test(k));

  const buildings = [...new Set(rows.map(r => r[buildingKey]).filter(Boolean))];
  const types = [...new Set(rows.map(r => r[typeKey]).filter(Boolean))];
  const companies = [...new Set(rows.map(r => r[companyKey]).filter(Boolean))];
  const years = [...new Set(rows.map(r => parseThaiDate_(r[dateKey])).filter(Boolean).map(d => d.y))].sort((a,b) => b - a);

  const bSel = document.getElementById('filterBuilding');
  const tSel = document.getElementById('filterType');
  const ySel = document.getElementById('filterYear');
  const mSel = document.getElementById('filterMonth');
  const cSel = document.getElementById('filterCompany');

  bSel.innerHTML = '<option value="">ทุกอาคาร</option>' + buildings.map(b => `<option value="${escAttr(b)}">${escHtml(b)}</option>`).join('');
  tSel.innerHTML = '<option value="">ทุกประเภทงาน</option>' + types.map(t => `<option value="${escAttr(t)}">${escHtml(t)}</option>`).join('');
  ySel.innerHTML = '<option value="">ทุกปี</option>' + years.map(y => `<option value="${y}">${y}</option>`).join('');
  const monthNames = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  mSel.innerHTML = '<option value="">ทุกเดือน</option>' + monthNames.map((m, i) => `<option value="${i+1}">${m}</option>`).join('');
  cSel.innerHTML = '<option value="">ทุกบริษัทผู้ให้บริการ</option>' + companies.map(c => `<option value="${escAttr(c)}">${escHtml(c)}</option>`).join('');

  bSel.dataset.key = buildingKey;
  tSel.dataset.key = typeKey;
  ySel.dataset.key = dateKey;
  mSel.dataset.key = dateKey;
  cSel.dataset.key = companyKey;
}

// รองรับวันที่ฟอร์แมต dd/mm/yyyy (ตามที่ formatCellValue_ ฝั่ง backend แปลงให้) -> {d,m,y}
function parseThaiDate_(str) {
  if (!str) return null;
  const parts = String(str).split(/[\/\-]/);
  if (parts.length < 3) return null;
  const d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
  if (isNaN(d) || isNaN(m) || isNaN(y)) return null;
  return { d, m, y };
}

function parseCost_(v) {
  if (v === '' || v === null || v === undefined) return 0;
  const n = parseFloat(String(v).replace(/,/g, ''));
  return isNaN(n) ? 0 : n;
}

function drawRepairChart_() {
  const rows = DASH_REPAIR_ROWS;
  if (!rows.length || !window.Chart) return;
  const keys = Object.keys(rows[0]).filter(k => k !== '_row');
  const buildingKey = keys.find(k => /building|อาคาร/i.test(k));
  const typeKey = keys.find(k => /ประเภท|^type/i.test(k));
  const costKey = keys.find(k => /ราคา|cost|price/i.test(k));
  const dateKey = keys.find(k => /^date$|วันที่/i.test(k));
  const companyKey = keys.find(k => /ผู้ดำเนินการ|ผู้รับเหมา|ผู้ให้บริการซ่อม/i.test(k));
  const detailKey = keys.find(k => /รายละเอียด|detail/i.test(k));

  const bVal = document.getElementById('filterBuilding')?.value || '';
  const tVal = document.getElementById('filterType')?.value || '';
  const yVal = document.getElementById('filterYear')?.value || '';
  const mVal = document.getElementById('filterMonth')?.value || '';
  const cVal = document.getElementById('filterCompany')?.value || '';
  const dVal = (document.getElementById('filterDetail')?.value || '').trim().toLowerCase();

  let filtered = rows;
  if (bVal) filtered = filtered.filter(r => r[buildingKey] === bVal);
  if (tVal) filtered = filtered.filter(r => r[typeKey] === tVal);
  if (cVal) filtered = filtered.filter(r => r[companyKey] === cVal);
  if (yVal) filtered = filtered.filter(r => { const dt = parseThaiDate_(r[dateKey]); return dt && String(dt.y) === yVal; });
  if (mVal) filtered = filtered.filter(r => { const dt = parseThaiDate_(r[dateKey]); return dt && String(dt.m) === mVal; });
  if (dVal) filtered = filtered.filter(r => String(r[detailKey] || '').toLowerCase().indexOf(dVal) !== -1);

  // จัดกลุ่มค่าใช้จ่ายรวมตาม Building x ประเภท (stacked bar) เพื่อวิเคราะห์ง่าย
  const buildings = [...new Set(filtered.map(r => r[buildingKey]).filter(Boolean))];
  const types = [...new Set(rows.map(r => r[typeKey]).filter(Boolean))];
  const colors = { 'งานบำรุงรักษา-MA': '#a78bfa', 'งานซ่อมแซม-CM': '#f85149', 'งานบำรุงรักษา-PM': '#22c55e' };
  const fallbackColors = ['#ff8c00', '#f85149', '#22c55e', '#a78bfa', '#2563eb'];

  const datasets = types.map((t, i) => ({
    label: t,
    data: buildings.map(b => filtered.filter(r => r[buildingKey] === b && r[typeKey] === t)
      .reduce((sum, r) => sum + parseCost_(r[costKey]), 0)),
    backgroundColor: colors[t] || fallbackColors[i % fallbackColors.length]
  }));

  const totalCost = filtered.reduce((sum, r) => sum + parseCost_(r[costKey]), 0);
  document.getElementById('costSummary').textContent =
    `รวม ${filtered.length} รายการ · ค่าใช้จ่ายรวม ${totalCost.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})} บาท`;

  const ctx = document.getElementById('repairCostChart').getContext('2d');
  if (DASH_COST_CHART) DASH_COST_CHART.destroy();
  DASH_COST_CHART = new Chart(ctx, {
    type: 'bar',
    data: { labels: buildings, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { stacked: true, ticks: { color: '#8a8580' }, grid: { color: 'rgba(255,140,0,.08)' } },
        y: { stacked: true, ticks: { color: '#8a8580' }, grid: { color: 'rgba(255,140,0,.08)' } }
      },
      plugins: { legend: { labels: { color: '#f0ede8' } } }
    }
  });

  // ตารางรายละเอียดใต้กราฟ (เรียงล่าสุดก่อน)
  const detailEl = document.getElementById('repairDetailTable');
  if (detailEl) {
    const sorted = [...filtered].sort((a, b) => b._row - a._row).slice(0, 100);
    let tbl = '<table><thead><tr>' +
      [buildingKey, dateKey, detailKey, companyKey, costKey, typeKey].filter(Boolean).map(h => `<th>${escHtml(h)}</th>`).join('') +
      '</tr></thead><tbody>';
    sorted.forEach(r => {
      tbl += '<tr>' + [buildingKey, dateKey, detailKey, companyKey, costKey, typeKey].filter(Boolean)
        .map(h => `<td>${escHtml(r[h] ?? '')}</td>`).join('') + '</tr>';
    });
    tbl += '</tbody></table>';
    detailEl.innerHTML = tbl + (filtered.length > 100 ? `<div style="padding:8px;font-size:11px;color:var(--text2)">แสดง 100 จาก ${filtered.length} รายการ ลอง filter เพิ่มเพื่อดูเฉพาะที่ต้องการ</div>` : '');
  }
}

function cssId(s){ return String(s).replace(/[^a-zA-Z0-9]/g,'_'); }
function escAttr(s){ return String(s).replace(/'/g,"\\'"); }

function renderQrImage(elementId, genCode, size) {
  // QR ต้องชี้ไปหน้าเว็บที่กำลังเปิดอยู่จริง (frontend) ไม่ใช่ backend API_URL
  const baseUrl = window.location.href.split('?')[0];
  const scanUrl = baseUrl + '?genid=' + encodeURIComponent(genCode);
  const qrImgUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&data=' + encodeURIComponent(scanUrl);
  const target = document.getElementById(elementId);
  if (target) target.innerHTML = `<div class="qr-box"><img src="${qrImgUrl}" width="${size}" height="${size}"></div>`;
}

function showGenQr(code, name) {
  const w = window.open('', '_blank', 'width=420,height=520');
  const scanUrl = window.location.href.split('?')[0] + '?genid=' + encodeURIComponent(code);
  const qrImgUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(scanUrl);
  w.document.write(`
    <html><head><title>QR - ${name}</title></head>
    <body style="font-family:sans-serif;text-align:center;padding:20px">
      <h3>${name}</h3>
      <p style="color:#666">${code}</p>
      <img src="${qrImgUrl}" width="300" height="300">
      <p style="font-size:11px;color:#999">สแกนเพื่อบันทึกค่า PM</p>
      <button onclick="window.print()" style="margin-top:10px;padding:8px 16px">🖨️ พิมพ์</button>
    </body></html>`);
}

/* ---------- QR SCAN ---------- */
function renderQrScan() {
  const el = document.getElementById('pageContent');
  el.innerHTML = pageHeader('สแกน QR Code', 'สแกน QR ที่ติดหน้าเครื่องเพื่อบันทึกค่า PM ทันที') + `
    <div class="card">
      <div id="qrReader"></div>
      <div id="qrResult" style="margin-top:12px;font-size:12px;color:var(--text2)"></div>
    </div>`;
  const qr = new Html5Qrcode('qrReader');
  qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: 220 },
    (decodedText) => {
      qr.stop();
      let genId = decodedText;
      try {
        const u = new URL(decodedText);
        genId = u.searchParams.get('genid') || decodedText;
      } catch(e) {}
      document.getElementById('qrResult').textContent = 'พบเครื่อง: ' + genId + ' — กำลังเปิดฟอร์มบันทึก...';
      setTimeout(() => renderPmFromScan(genId), 600);
    },
    () => {}
  ).catch(err => {
    document.getElementById('qrResult').textContent = 'ไม่สามารถเปิดกล้องได้: ' + err;
  });
}

function renderPmFromScan(genId) {
  genId = genId || PRELOAD_GENID;
  if (!genId) { navigate('qrscan'); return; }
  document.getElementById('pageContent').innerHTML = pageHeader('กำลังโหลด...', '') + '<div class="loading">กำลังค้นหาเครื่อง ' + escHtml(genId) + '...</div>';
  callApi('getGeneratorById', { code: genId }).then(res => {
    if (!res.ok) {
      document.getElementById('pageContent').innerHTML = pageHeader('ไม่พบเครื่อง', genId) +
        `<div class="card err-msg">${escHtml(res.error)}</div>`;
      return;
    }
    renderPmForm('weekly', res.generator);
  }).catch(err => {
    document.getElementById('pageContent').innerHTML = pageHeader('เกิดข้อผิดพลาด', '') +
      `<div class="card err-msg">เชื่อมต่อไม่ได้: ${escHtml(err.message)}
        <button class="btn small ghost" onclick="renderPmFromScan('${escAttr(genId)}')" style="margin-left:8px">ลองใหม่</button></div>`;
  });
}

}

function applyTestReportFilter_() {
  const fromIso = document.getElementById('trFrom').value; // yyyy-mm-dd จาก <input type=date>
  const toIso = document.getElementById('trTo').value;
  renderTestReport(toThaiDate_(fromIso), toThaiDate_(toIso));
}

// yyyy-mm-dd (จาก <input type=date>) -> dd/MM/yyyy (รูปแบบเดียวกับที่ backend เก็บ/กรอง)
function toThaiDate_(isoStr) {
  if (!isoStr) return '';
  const parts = isoStr.split('-');
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}
// dd/MM/yyyy -> yyyy-mm-dd (ใช้ตอนเซ็ตค่า value กลับเข้า <input type=date> เวลากดกรองซ้ำ)
function toIsoDate_(thaiStr) {
  if (!thaiStr) return '';
  const parts = thaiStr.split('/');
  if (parts.length !== 3) return '';
  return parts[2] + '-' + parts[1] + '-' + parts[0];
}

function testReportStatusBadge_(status) {
  const s = String(status || '').trim();
  if (!s) return `<span class="status-badge status-shared">ยังไม่มีข้อมูล</span>`;
  if (/ผิดปกติ|fail|abnormal/i.test(s)) return `<span class="status-badge status-danger">🔴 ${escHtml(s)}</span>`;
  if (/ปกติ|pass|normal/i.test(s)) return `<span class="status-badge status-ok">🟢 ${escHtml(s)}</span>`;
  return `<span class="status-badge status-warn">${escHtml(s)}</span>`;
}

function testReportSection_(label, summary) {
  if (!summary || !summary.count) {
    return `<div class="tr-block"><div class="tr-block-title">${label}</div><div class="tr-empty">ยังไม่มีข้อมูล</div></div>`;
  }
  return `<div class="tr-block">
    <div class="tr-block-title">${label} <span class="tr-count">(${summary.count} ครั้ง)</span></div>
    <div class="tr-block-row">ล่าสุด: ${escHtml(summary.lastDate || '-')}</div>
    <div class="tr-block-row">${testReportStatusBadge_(summary.lastStatus)}</div>
    ${summary.lastBy ? `<div class="tr-block-row">👤 ${escHtml(summary.lastBy)}</div>` : ''}
  </div>`;
}

function renderTestReportBody_(res) {
  if (!res.buildings || !res.buildings.length) {
    return '<div class="card loading">ไม่พบข้อมูลเครื่องกำเนิดไฟฟ้าในสิทธิ์ของท่าน หรือไม่มีข้อมูลในช่วงวันที่ที่เลือก</div>';
  }
  let html = '';
  if (!res.dailyCheckAvailable) {
    html += `<div class="card" style="border-color:#ff8c00"><b>⚠️ หมายเหตุ:</b> ยังไม่มีการบันทึก Daily Check เข้าระบบเลย ส่วน Daily Check ในรายงานนี้จะแสดง "ยังไม่มีข้อมูล" จนกว่าจะเริ่มมีการกรอกข้อมูลจริง</div>`;
  }
  res.buildings.forEach(group => {
    html += `<div class="nav-section-label" style="margin-top:18px">
        <span class="nav-section-dot" style="background:#a78bfa"></span>${escHtml(group.building)} (${group.machines.length} เครื่อง)
      </div>
      <div class="grid-cards">`;
    group.machines.forEach(m => {
      html += `<div class="card">
        <div class="gen-name">${escHtml(m.name)}</div>
        <div class="gen-meta">Code: ${escHtml(m.code)}${m.frequency ? ' · ความถี่: ' + escHtml(m.frequency) : ''}</div>
        <div class="tr-grid">
          ${testReportSection_('✅ Daily Check', m.daily)}
          ${testReportSection_('📋 Weekly Test', m.weekly)}
          ${testReportSection_('📅 Annual Test', m.annual)}
        </div>
        <div class="tr-block" style="margin-top:8px">
          <div class="tr-block-title">⛽ เชื้อเพลิง (ตามช่วงที่กรอง)</div>
          <div class="tr-block-row">ใช้ไป: ${m.fuel.usedTotal.toLocaleString()} L · เติม: ${m.fuel.refillTotal.toLocaleString()} L · บันทึก ${m.fuel.logCount} รายการ</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

function applyDcGenPreset_(selectEl) {
  const code = selectEl.value;

  updateTechnicianForBuilding_('dc_inspector_sel', DC_GEN_MAP[code].building);

function readFileAsBase64_(fileInput) {
  return new Promise((resolve) => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) { resolve(null); return; }
    const reader = new FileReader();
    reader.onload = () => resolve({ base64: reader.result, mimeType: file.type || 'image/jpeg' });
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

function submitDailyCheck_() {
  const wrap = document.getElementById('dcFormWrap');
  const msg = document.getElementById('dcSubmitMsg');
  msg.textContent = 'กำลังบันทึก (รอสักครู่ถ้ามีรูปแนบ)...';

  const values = {};
  wrap.querySelectorAll('[data-dcfield]').forEach(el => {
    let val = el.value;
    if (el.dataset.type === 'date' && val) {
      const [y, m, d] = val.split('-'); val = `${d}/${m}/${y}`;
    }
    values[el.dataset.dcfield] = val;
  });

  const statusInputs = wrap.querySelectorAll('[data-dctype="status"], [data-dctype="value"]');
  statusInputs.forEach(el => {
    const item = el.dataset.dcitem;
    const colName = item === 'FUEL LEVEL' ? 'FUEL LEVEL (Litre)' : (item + ' - ผล');
    values[colName] = el.value;
  });

  const photoInputs = Array.from(wrap.querySelectorAll('input[type="file"][data-dcitem]'));
  Promise.all(photoInputs.map(inp => readFileAsBase64_(inp).then(data => ({ item: inp.dataset.dcitem, data }))))
    .then(results => {
      const photos = {};
      results.forEach(r => { if (r.data) photos[r.item] = r.data; });
      const sigCanvas = document.getElementById('dc_sup_sigpad');
      if (sigCanvas && sigCanvas.dataset.hasSig === '1') {
        photos['SUPERVISOR_SIGNATURE'] = { base64: sigCanvas.toDataURL('image/png'), mimeType: 'image/png' };
      }
      const buildingCode = values['Building'];
      return callApi('submitDailyCheck', { buildingCode, values, photos });
    })
    .then(res => {
      msg.textContent = res.ok ? '✓ บันทึกสำเร็จ' : ('✕ ' + res.error);
      msg.style.color = res.ok ? 'var(--green)' : 'var(--rose)';
      if (res.ok) setTimeout(renderDailyCheck, 1200);
    })
    .catch(err => {
      msg.textContent = '✕ เชื่อมต่อไม่ได้: ' + err.message;
      msg.style.color = 'var(--rose)';
    });
}

/* ---------- PM FORM (dynamic ตาม header จริงในชีต) ---------- */

// วิเคราะห์ header ว่าควรเป็น dropdown (มีตัวเลือกในวงเล็บ) หรือ text ปกติ (มี range เป็น hint)
function analyzeField_(header) {
  const m = header.match(/\(([^)]+)\)\s*$/); // จับวงเล็บสุดท้ายของ header
  if (!m) return { type: 'text', hint: '' };
  const content = m[1].trim();
  const hasDigit = /\d/.test(content);
  const hasSlash = content.indexOf('/') !== -1;

  // กรณีมีตัวเลข + ขีดกลาง เช่น "35-90 oC", "60-100 Psig", "24 - 30 Vdc." -> เป็นช่วงค่าอ้างอิง ไม่ใช่ dropdown
  if (hasDigit && !hasSlash) {
    return { type: 'text', hint: content };
  }
  // กรณีมี / และไม่ใช่ตัวเลขล้วน -> เป็นตัวเลือกให้เลือก (dropdown)
  if (hasSlash) {
    let opts = content.split('/').map(s => s.trim()).filter(Boolean);
    // กรณี "Lo/Mid/Hi Level" -> ตัวเลือกสุดท้ายติดคำว่า "Level" มาด้วย ต้องตัดออกให้เหลือแค่ "Hi"
    opts = opts.map((o, i) => {
      if (i === opts.length - 1 && opts.length > 1) {
        return o.replace(/\s*(level|ระดับ)\s*$/i, '').trim() || o;
      }
      return o;
    });
    const looksLikeOptions = opts.length >= 2 && opts.length <= 6 && opts.every(o => o.length <= 25 && !/^\d+$/.test(o));
    if (looksLikeOptions) return { type: 'select', options: opts, hint: '' };
  }
  return { type: 'text', hint: content };
}

// จัดกลุ่ม header เป็นหมวดตามคำนำหน้า (Before/Running/After/Function/...) เพื่อลดอาการตาลาย
function groupOf_(header) {
  const h = header.toLowerCase();
  if (/^period$/i.test(header.trim())) return 'ข้อมูลทั่วไป';
  if (/^(company|building|code|date|อาคาร|บริษัท|รหัส|วันที่)/i.test(header)) return 'ข้อมูลทั่วไป';
  if (/^function|pm & emergency|pm&emergency/i.test(h)) return 'เงื่อนไขการทดสอบ (Function Test)';
  if (/^before\s*:/i.test(h)) return 'ก่อนทดสอบ (Before Test)';
  if (/^running\s*:|start running time|stop running time/i.test(h)) return 'ระหว่างทดสอบ (Running)';
  if (/^after\s*(test)?\s*:/i.test(h)) return 'หลังทดสอบ (After Test)';
  if (/test load|load generator|testing period|summarize/i.test(h)) return 'สรุปผล Load Test';
  if (/หัวหน้า/i.test(h)) return 'หัวหน้าพิจารณา'; // แยก module ไม่ปนกับช่างผู้ทดสอบ
  if (/สภาพโดยทั่วไป|availability|ช่างผู้ทดสอบ|checked by|signature/i.test(h)) return 'สรุปผลตรวจ / ผู้บันทึก';
  return 'ข้อมูลอื่นๆ';
}

const PERIOD_OPTIONS = ['Week', 'Month', 'Quarter', 'Annual', 'Emergency', 'PM'];

// เปลี่ยนข้อความ label ที่แสดงผลให้อ่านง่ายขึ้น โดยไม่แตะชื่อคอลัมน์จริงในชีต (ยังใช้ header เดิม submit ตามปกติ)
function friendlyLabel_(h) {
  if (/^หัวหน้าตรวจสอบ$/i.test(h.trim())) return 'หัวหน้างานลงชื่อ';
  return h;
}

// แยก label ที่มีทั้งอังกฤษ+ไทยปนกัน ("BEFORE : OIL LEVEL บันทึกระดับน้ำมัน (LO/HI)") ให้ไทยขึ้นบรรทัดใหม่ใต้อังกฤษ อ่านง่ายขึ้น
function splitLabelLines_(header) {
  const m = header.match(/[\u0E00-\u0E7F]/);
  if (!m) return { en: header, th: '' };
  const idx = m.index;
  return { en: header.slice(0, idx).trim(), th: header.slice(idx).trim() };
}
function renderFieldLabelHtml_(h) {
  const friendly = friendlyLabel_(h);
  const { en, th } = splitLabelLines_(friendly);
  return th ? `${escHtml(en)}<br><span class="label-th">${escHtml(th)}</span>` : escHtml(en);
}

          <div class="blink-text-slow" style="color:var(--amber);font-weight:700">

    headers.forEach(h => {

            <option value="ไม่อนุมัติ">❌ ไม่อนุมัติ</option>
          </select>
        </div>
        <div class="field" id="pm_sup_detail_wrap" style="display:none">
          <label>รายละเอียดเพิ่มเติม (กรณีไม่อนุมัติ)</label>
          <input id="pm_sup_detail" data-header="รายละเอียดเพิ่มเติม (หัวหน้า)">
        </div>`;
      }
      groups[g].forEach(h => {
        const inputId = 'pmf_' + cssId(h);
        let preset = '';
        if (presetGenerator) {
          if (/building|อาคาร/i.test(h)) preset = presetGenerator[Object.keys(presetGenerator).find(k=>/building|อาคาร/i.test(k))] || '';
          if (/^code|รหัสเครื่องจักร/i.test(h)) preset = presetGenerator[Object.keys(presetGenerator).find(k=>/^code|รหัสเครื่องจักร/i.test(k))] || '';
          if (/company|บริษัท/i.test(h)) preset = presetGenerator[Object.keys(presetGenerator).find(k=>/company|บริษัท/i.test(k))] || '';
        }

        if (/^period$/i.test(h.trim())) {
          formHtml += `<div class="field"><label>${renderFieldLabelHtml_(h)}</label>
            <select id="${inputId}" data-header="${escAttr(h)}">
              <option value=""></option>
              ${PERIOD_OPTIONS.map(o => `<option value="${o}">${o}</option>`).join('')}
            </select></div>`;
          return;
        }

        // ช่องวันที่ -> ใช้ date picker ของ browser แล้วแปลงเป็น dd/mm/yyyy ตอนบันทึก
        if (/^date$|วันที่/i.test(h.trim()) && !/update|start|stop|finish/i.test(h)) {
          const todayIso = new Date().toISOString().slice(0, 10);
          formHtml += `<div class="field"><label>${renderFieldLabelHtml_(h)}</label>
            <input type="date" id="${inputId}" data-header="${escAttr(h)}" data-type="date" value="${todayIso}"></div>`;
          return;
        }

        // ช่อง Start/Stop Running Time -> ใช้ time picker เปล่า ให้ช่างระบุเวลาเองตอนสตาร์ท/หยุดเครื่องจริง (ไม่ auto-fill)
        if (/start running time|stop running time/i.test(h)) {
          formHtml += `<div class="field"><label>${renderFieldLabelHtml_(h)}</label>
            <input type="time" id="${inputId}" data-header="${escAttr(h)}"></div>`;

        // ช่องผู้ตรวจสอบ/ผู้ทดสอบ -> ใช้ dropdown รายชื่อช่างที่รับผิดชอบแทนพิมพ์เอง
        if (/ผู้ตรวจสอบ|ผู้ทดสอบ|ช่างผู้ทดสอบ|inspector|checked\s*by/i.test(h)) {
          const buildingGuess = presetGenerator ? (presetGenerator[Object.keys(presetGenerator).find(k=>/building|อาคาร/i.test(k))] || '') : sessionDefaultBuilding_();
          formHtml += renderTechnicianFieldHtml_(h, 'data-header', h, inputId, buildingGuess);
          return;
        }

        const analysis = analyzeField_(h);
        if (analysis.type === 'select') {
          formHtml += `<div class="field"><label>${renderFieldLabelHtml_(h)}</label>
            <select id="${inputId}" data-header="${escAttr(h)}">
              <option value=""></option>
              ${analysis.options.map(o => `<option value="${escAttr(o)}">${escHtml(o)}</option>`).join('')}
            </select></div>`;
        } else {
          const hintAttr = analysis.hint ? ` placeholder="เช่น ${escAttr(analysis.hint)}"` : '';
          formHtml += `<div class="field"><label>${renderFieldLabelHtml_(h)}</label>

      }

    formHtml = `<div id="pmFormWrap">${supervisorAlertHtml}${genPickerHtml}${formHtml}
      <div class="card">
        <button class="btn" onclick="submitPm('${period}')">✓ บันทึกข้อมูล</button>
        <span id="pmSubmitMsg" style="margin-left:12px;font-size:12px"></span>
      </div>
    </div>`;

    // ตารางประวัติล่าสุด
    let tableHtml = '<div class="card"><div class="card-title">รายการล่าสุด (10 รายการ)</div><div class="table-wrap"><table><thead><tr>';
    headers.slice(0, 8).forEach(h => tableHtml += `<th>${escHtml(h)}</th>`);
    tableHtml += '</tr></thead><tbody>';
    (res.rows || []).forEach(r => {
      tableHtml += '<tr>';
      headers.slice(0, 8).forEach(h => tableHtml += `<td>${escHtml(r[h] ?? '')}</td>`);
      tableHtml += '</tr>';
    });
    tableHtml += '</tbody></table></div></div>';

    el.innerHTML = pageHeader(title, 'บันทึกผลตรวจสอบเครื่องกำเนิดไฟฟ้า') + formHtml + tableHtml;
    initSignaturePad_('pm_sup_sigpad');
  }).catch(err => {
    el.innerHTML = pageHeader(title, '') + `<div class="card err-msg">เชื่อมต่อไม่ได้: ${escHtml(err.message)}
      <button class="btn small ghost" onclick="renderPmForm('${period}')" style="margin-left:8px">ลองใหม่</button></div>`;

}

// เรียกเมื่อผู้ใช้เลือกเครื่องจาก dropdown "เลือกเครื่องกำเนิดไฟฟ้า" -> auto-fill Company/Building/Code
function applyGenPreset(selectEl) {
  const code = selectEl.value;
  const wrap = document.getElementById('pmFormWrap');
  if (!code || !PM_GEN_MAP[code]) return;
  const info = PM_GEN_MAP[code];
  const wrapFields = wrap.querySelectorAll('[data-header]');
  wrapFields.forEach(el => {
    const h = el.dataset.header;
    if (/company|บริษัท/i.test(h)) el.value = info.company;
    else if (/building|อาคาร/i.test(h)) el.value = info.building;
    else if (/^code|รหัสเครื่องจักร/i.test(h)) el.value = info.code;
  });
  // อัปเดต dropdown ช่างผู้รับผิดชอบให้ตรงกับอาคารใหม่ (ถ้ามี field แบบนี้อยู่ในฟอร์ม)
  wrap.querySelectorAll('select[id$="_sel"]').forEach(sel => updateTechnicianForBuilding_(sel.id, info.building));
}

// พอหัวหน้างานเลือกผล "อนุมัติ/ไม่อนุมัติ" ในฟอร์ม PM -> เติมวันที่วันนี้ให้อัตโนมัติ + โชว์ช่องรายละเอียดถ้าเลือก "ไม่อนุมัติ"
function togglePmSupervisorAck_(selectEl) {
  const dateEl = document.getElementById('pm_sup_date');
  if (selectEl.value && dateEl && !dateEl.value) {
    dateEl.value = new Date().toISOString().slice(0, 10);
  }
  const detailWrap = document.getElementById('pm_sup_detail_wrap');
  if (detailWrap) detailWrap.style.display = selectEl.value === 'ไม่อนุมัติ' ? 'block' : 'none';
}

function submitPm(period) {
  const wrap = document.getElementById('pmFormWrap');
  const fields = wrap.querySelectorAll('input[data-header], select[data-header]');
  const values = {};
  let buildingCode = '';
  fields.forEach(inp => {
    let val = inp.value;
    if (inp.dataset.type === 'date' && val) {
      // input type=date ให้ค่าแบบ yyyy-mm-dd -> แปลงเป็น dd/mm/yyyy ให้ตรงกับข้อมูลเดิมในชีต
      const [y, m, d] = val.split('-');
      val = `${d}/${m}/${y}`;
    }
    values[inp.dataset.header] = val;
    if (/building|อาคาร/i.test(inp.dataset.header)) buildingCode = val;
  });
  const msg = document.getElementById('pmSubmitMsg');
  msg.textContent = 'กำลังบันทึก (รอสักครู่ถ้ามีลายเซ็นต์)...';

  const sigCanvas = document.getElementById('pm_sup_sigpad');
  let signature = null;
  if (sigCanvas && sigCanvas.dataset.hasSig === '1') {
    signature = { base64: sigCanvas.toDataURL('image/png'), mimeType: 'image/png' };
  }

  callApi('submitPmRecord', { period, buildingCode, values, signature }).then(res => {
    msg.textContent = res.ok ? '✓ บันทึกสำเร็จ' : ('✕ ' + res.error);
    msg.style.color = res.ok ? 'var(--green)' : 'var(--rose)';
    if (res.ok) setTimeout(() => renderPmForm(period), 1200);
  });
}

/* ---------- FUEL LOG ---------- */
let FUEL_GEN_MAP = {};

function renderFuel() {
  const el = document.getElementById('pageContent');
  el.innerHTML = pageHeader('บันทึกเชื้อเพลิง', 'Weekly Test Run / Refuel / Emergency Use') + '<div class="loading">กำลังโหลด...</div>';

  callApi('getFuelFormBundle', { limit: 15 }).then(bundle => {
    if (!bundle.ok) {
      el.innerHTML = pageHeader('บันทึกเชื้อเพลิง', '') + `<div class="card err-msg">โหลดข้อมูลไม่สำเร็จ: ${escHtml(bundle.error || 'ไม่ทราบสาเหตุ')}
        <button class="btn small ghost" onclick="renderFuel()" style="margin-left:8px">ลองใหม่</button></div>`;
      return;
    }
    const res = bundle.fuel, genRes = bundle.gen, tankRes = bundle.tank;
    const headers = (res.headers || []).filter(h => h && h !== 'No.');

    // สร้าง TANK_MAP จาก Re-Order Point_Fuel (ข้อมูลคงเหลือจริงล่าสุด) key ด้วย Code
    const TANK_MAP = {};
    if (tankRes.ok && (tankRes.rows || []).length) {
      const trows = tankRes.rows;
      const tKeys = Object.keys(trows[0]).filter(k => k !== '_row');
      const tCodeKey = tKeys.find(k => /^code/i.test(k) && !/machine/i.test(k));
      const tFullKey = tKeys.find(k => /^full/i.test(k));
      const tP80Key = tKeys.find(k => /80/.test(k));
      const tActualKey = tKeys.find(k => /actual/i.test(k));
      if (tCodeKey) {
        trows.forEach(r => {
          const code = r[tCodeKey];
          if (!code) return;
          TANK_MAP[code] = {
            full: tFullKey ? parseFloat(r[tFullKey]) || 0 : 0,
            p80: tP80Key ? parseFloat(r[tP80Key]) || 0 : 0,
            actual: tActualKey ? parseFloat(r[tActualKey]) : NaN
          };
        });
      }
    }

    // dropdown เลือกเครื่องกำเนิดไฟฟ้า -> auto-fill Company/Building/Code + Full/80%/50% Storage + Fuel Level Before
    let genPickerHtml = '';
    FUEL_GEN_MAP = {};
    if (genRes.ok && (genRes.rows || []).length) {
      const rows = genRes.rows;
      const companyKey = Object.keys(rows[0]).find(k => /company|บริษัท/i.test(k) && k !== '_row');
      const buildingKey = Object.keys(rows[0]).find(k => /building|อาคาร/i.test(k) && k !== '_row');
      const codeKey = Object.keys(rows[0]).find(k => /^code/i.test(k) && !/machine/i.test(k) && k !== '_row');
      const nameKey = Object.keys(rows[0]).find(k => /name|ชื่อ/i.test(k) && k !== '_row');
      const fullKey = Object.keys(rows[0]).find(k => /full.*capacity|full.*litre/i.test(k) && k !== '_row');

      let options = '<option value="">— เลือกเครื่องกำเนิดไฟฟ้า —</option>';
      rows.forEach(r => {
        const code = codeKey ? r[codeKey] : '';
        if (!code) return;
        const tank = TANK_MAP[code]; // ข้อมูลจริงจาก Re-Order Point_Fuel (ถ้ามี) แม่นกว่าคำนวณเอง
        const fallbackFull = fullKey ? parseFloat(r[fullKey]) || 0 : 0;
        const full = (tank && tank.full) ? tank.full : fallbackFull;
        FUEL_GEN_MAP[code] = {
          company: companyKey ? r[companyKey] : '',
          building: buildingKey ? r[buildingKey] : '',
          code: code,
          full: full,
          p80: (tank && tank.p80) ? tank.p80 : full * 0.8,
          actual: tank ? tank.actual : NaN
        };
        const actualTxt = tank && !isNaN(tank.actual) ? ` — คงเหลือ ${tank.actual.toLocaleString()}L` : '';
        const label = `${r[buildingKey] || ''} · ${r[nameKey] || ''} (${code})${actualTxt}`;
        options += `<option value="${escAttr(code)}">${escHtml(label)}</option>`;
      });

      genPickerHtml = `<div class="card">
        <div class="card-title">เลือกเครื่องกำเนิดไฟฟ้า</div>
        <div class="field" style="max-width:460px">
          <select id="fuelGenPicker" onchange="applyFuelGenPreset(this)">${options}</select>
        </div>
        <div style="font-size:11px;color:var(--text2);margin-top:8px">
          ระบบดึง Full/80%/คงเหลือล่าสุด จาก "Re-Order Point_Fuel" มาเติมให้อัตโนมัติ
          และจะอัปเดตยอดคงเหลือกลับไปที่ชีตนั้นทันทีหลังบันทึกสำเร็จ
        </div>
      </div>`;
    }

    let formHtml = `<div id="fuelFormWrap">${genPickerHtml}<div class="card"><div class="card-title">บันทึกใหม่</div><div class="form-grid" id="fuelFormGrid">`;
    headers.forEach(h => {
      if (/^date$|วันที่/i.test(h.trim())) {
        const todayIso = new Date().toISOString().slice(0, 10);
        formHtml += `<div class="field"><label>${escHtml(h)}</label><input type="date" id="ff_${cssId(h)}" data-header="${escAttr(h)}" data-type="date" value="${todayIso}"></div>`;
      } else {
        formHtml += `<div class="field"><label>${escHtml(h)}</label><input id="ff_${cssId(h)}" data-header="${escAttr(h)}"></div>`;
      }
    });
    formHtml += `</div><button class="btn" style="margin-top:14px" onclick="submitFuel()">✓ บันทึก</button>
      <span id="fuelSubmitMsg" style="margin-left:12px;font-size:12px"></span></div></div>`;

    let tableHtml = '<div class="card"><div class="card-title">ประวัติล่าสุด</div><div class="table-wrap"><table><thead><tr>';
    headers.forEach(h => tableHtml += `<th>${escHtml(h)}</th>`);
    tableHtml += '</tr></thead><tbody>';
    (res.rows || []).forEach(r => {
      tableHtml += '<tr>';
      headers.forEach(h => tableHtml += `<td>${escHtml(r[h] ?? '')}</td>`);
      tableHtml += '</tr>';
    });
    tableHtml += '</tbody></table></div></div>';

    const storeTankHtml = `<div class="card">
      <div class="card-title">🛢️ สถานะถังน้ำมันสำรองส่วนกลาง (STORAGE TANK)</div>
      ${renderStoreTankCardsOnly_(tankRes)}
    </div>`;
    const dayTankOwnHtml = renderDayTankCardsForSession_(tankRes);
    const dayTankSectionHtml = dayTankOwnHtml
      ? `<div class="card"><div class="card-title">🔧 สถานะถังน้ำมันประจำเครื่อง (อาคารของคุณ)</div>${dayTankOwnHtml}</div>`
      : '';

    el.innerHTML = pageHeader('บันทึกเชื้อเพลิง', 'Weekly Test Run / Refuel / Emergency Use') + storeTankHtml + dayTankSectionHtml + formHtml + tableHtml;
  }).catch(err => {
    el.innerHTML = pageHeader('บันทึกเชื้อเพลิง', '') + `<div class="card err-msg">เชื่อมต่อไม่ได้: ${escHtml(err.message)}
      <button class="btn small ghost" onclick="renderFuel()" style="margin-left:8px">ลองใหม่</button></div>`;
  });
}

// เรียกเมื่อเลือกเครื่องจาก dropdown -> auto-fill Company/Building/Code + Full/80%/50% Storage + Fuel Level Before
function applyFuelGenPreset(selectEl) {
  const code = selectEl.value;
  if (!code || !FUEL_GEN_MAP[code]) return;
  const info = FUEL_GEN_MAP[code];
  const grid = document.getElementById('fuelFormGrid');
  grid.querySelectorAll('[data-header]').forEach(el => {
    const h = el.dataset.header;
    if (/company|บริษัท/i.test(h)) el.value = info.company;
    else if (/building|อาคาร/i.test(h)) el.value = info.building;
    else if (/^code/i.test(h)) el.value = info.code;
    else if (/full.*storage/i.test(h) && info.full) el.value = info.full;
    else if (/80%.*storage/i.test(h) && info.p80) el.value = info.p80;
    else if (/50%.*storage/i.test(h) && info.full) el.value = (info.full * 0.5).toFixed(1);
    else if (/fuel level before/i.test(h) && !isNaN(info.actual)) el.value = info.actual;
  });
}

function submitFuel() {
  const grid = document.getElementById('fuelFormGrid');
  const inputs = grid.querySelectorAll('input');
  const values = {}; let buildingCode = '';
  inputs.forEach(inp => {
    let val = inp.value;
    if (inp.dataset.type === 'date' && val) {
      const [y, m, d] = val.split('-');
      val = `${d}/${m}/${y}`;
    }
    values[inp.dataset.header] = val;
    if (/building|อาคาร/i.test(inp.dataset.header)) buildingCode = val;
  });
  const msg = document.getElementById('fuelSubmitMsg');
  msg.textContent = 'กำลังบันทึก...';
  callApi('submitFuelLog', { buildingCode, values }).then(res => {
    msg.textContent = res.ok ? '✓ บันทึกสำเร็จ' : ('✕ ' + res.error);
    msg.style.color = res.ok ? 'var(--green)' : 'var(--rose)';
    if (res.ok) setTimeout(renderFuel, 1200);
  });
}
