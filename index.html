<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PSD eNGINNo | SMART GENERATOR</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0d0d0f;--sidebar:#111115;--sidebar2:#16161b;
  --surface:#16161b;--surface2:#1c1c23;
  --border:rgba(255,140,0,.12);--border2:rgba(255,140,0,.22);
  --accent:#ff8c00;--accent2:#e67e00;--accent-glow:rgba(255,140,0,.18);
  --green:#22c55e;--amber:#ff8c00;--rose:#f85149;--purple:#a78bfa;
  --text:#f0ede8;--text2:#8a8580;--text3:#3a3830;
  --card:#16161b;--r:4px;--r2:3px;
  --shadow:0 4px 24px rgba(0,0,0,.6);
  --font:'Courier New',Courier,monospace;
  --sidebar-w:240px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font-family:var(--font)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ===== LOGIN ===== */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:8px;
  padding:32px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.login-logo{font-size:22px;font-weight:800;color:var(--accent);letter-spacing:.5px;margin-bottom:2px}
.login-sub{font-size:12px;color:var(--text2);margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{width:100%;padding:10px 12px;background:var(--surface2);
  border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--accent);color:#0d0d0f;border:none;padding:11px 18px;border-radius:var(--r);
  font-weight:700;cursor:pointer;font-size:13px;letter-spacing:.3px;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn.small{padding:6px 12px;font-size:12px}
.err-msg{color:var(--rose);font-size:12px;margin-top:10px}

/* ===== APP SHELL ===== */
#appShell{display:none;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--sidebar);border-right:1px solid var(--border);
  position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50}
.brand{padding:20px 18px;border-bottom:1px solid var(--border)}
.brand-title{font-size:16px;font-weight:800;color:var(--accent)}
.brand-sub{font-size:10px;color:var(--text2);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);
  color:var(--text2);cursor:pointer;font-size:13px;margin-bottom:2px;position:relative}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-glow);color:var(--accent)}
.user-box{padding:14px 18px;border-top:1px solid var(--border)}
.user-name{font-size:12px;font-weight:700}
.user-role{font-size:10px;color:var(--accent);margin-top:2px}
.logout-btn{font-size:11px;color:var(--text2);background:none;border:none;cursor:pointer;margin-top:8px}
.logout-btn:hover{color:var(--rose)}

.main{margin-left:var(--sidebar-w);padding:24px;max-width:1400px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-title{font-size:20px;font-weight:800}
.page-desc{font-size:12px;color:var(--text2);margin-top:2px}

.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}

table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--surface2);color:var(--accent);text-align:left;padding:8px 10px;
  border-bottom:2px solid var(--border2);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:hover td{background:var(--surface2)}
.table-wrap{overflow-x:auto;max-height:65vh;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r)}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.stat-card{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:16px}
.stat-num{font-size:26px;font-weight:800;color:var(--accent)}
.stat-label{font-size:11px;color:var(--text2);margin-top:4px}

.gen-card{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:14px;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.gen-name{font-weight:700;font-size:13px}
.gen-meta{font-size:11px;color:var(--text2);margin-top:3px}
.tag{display:inline-block;padding:2px 8px;border:1px solid var(--border2);border-radius:12px;font-size:10px;color:var(--accent)}

.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.qr-box{background:#fff;padding:10px;border-radius:6px;display:inline-block}
.hidden{display:none !important}
.badge{background:var(--rose);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px}
.loading{color:var(--text2);font-size:12px;padding:20px;text-align:center}

#qrReader{width:100%;max-width:400px;margin:0 auto}

.tank-card{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:14px;margin-bottom:10px}
.tank-card.big{padding:18px}
.tank-name{font-weight:700;font-size:13px}
.tank-sub{font-size:11px;color:var(--text2);margin-top:2px}
.tank-bar-bg{background:var(--surface);border-radius:6px;height:10px;margin-top:10px;overflow:hidden;border:1px solid var(--border)}
.tank-bar-fill{height:100%;border-radius:6px;transition:.3s}
.gauge-wrap{position:relative;height:14px;margin-top:12px}
.gauge-zones{display:flex;height:100%;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.gauge-zone{height:100%}
.gauge-marker{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;
  box-shadow:0 0 4px rgba(0,0,0,.8);transform:translateX(-50%);border-radius:2px}
.gauge-ticks{position:relative;height:14px;margin-top:2px}
.gauge-tick{position:absolute;transform:translateX(-50%);font-size:9px;color:var(--text2)}
.tank-nums{display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-top:5px}
.status-badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700;margin-left:8px}
.status-ok{background:rgba(34,197,94,.15);color:var(--green)}
.status-warn{background:rgba(255,140,0,.15);color:var(--amber)}
.status-danger{background:rgba(248,81,73,.15);color:var(--rose)}
.alert-row{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.3);border-radius:6px;
  padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filter-bar select{padding:8px 10px;background:var(--surface2);border:1px solid var(--border2);
  border-radius:var(--r);color:var(--text);font-size:12px;min-width:140px}
.chart-wrap{position:relative;height:320px}

@media (max-width:820px){
  .sidebar{transform:translateX(-100%);transition:.2s;width:220px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:16px}
  #menuBtn{display:block !important}
}
#menuBtn{display:none;background:var(--surface2);border:1px solid var(--border2);color:var(--text);
  padding:8px 12px;border-radius:var(--r);cursor:pointer;margin-bottom:10px}
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">PSD eNGINNo</div>
    <div class="login-sub">SMART GENERATOR MANAGEMENT SYSTEM</div>
    <div class="field">
      <label>Module / อาคาร</label>
      <input id="loginModuleKey" placeholder="เช่น eng-BTE, admin" autocomplete="off">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="รหัสผ่าน">
    </div>
    <button class="btn block" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div id="loginErr" class="err-msg hidden"></div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appShell">
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-title">⚡ eNGINNo</div>
      <div class="brand-sub">SMART GENERATOR</div>
    </div>
    <div class="nav" id="navList"></div>
    <div class="user-box">
      <div class="user-name" id="userName">-</div>
      <div class="user-role" id="userRole">-</div>
      <button class="logout-btn" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </div>

  <div class="main">
    <button id="menuBtn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ เมนู</button>
    <div id="pageContent"></div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG - แก้ API_URL เป็น URL ของ Web App ที่ deploy จาก Code.gs
   (ถ้าไฟล์นี้ถูก deploy เป็น HtmlService ของ Apps Script เอง สามารถ
    ปล่อยว่างไว้ ระบบจะเรียก google.script.run แทนอัตโนมัติ)
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwySzO68d7aBFdEEK8h3LTrzT07X3G7onC-QtZczWgOdUDDpnOyD0JlX_CUusPN8DjP/exec';
// อ่าน ?genid=xxx ตรงจาก URL เสมอ (ทำงานได้ทั้งบน Apps Script และ GitHub Pages/hosting อื่น)
const PRELOAD_GENID = new URLSearchParams(window.location.search).get('genid') || '';

let SESSION = null;
let CURRENT_PAGE = 'dashboard';

/* ---------- API CALLER (รองรับทั้ง fetch ไป Web App URL และ google.script.run) ---------- */
function callApi(action, data) {
  data = data || {};
  if (SESSION) data.session = SESSION;
  return new Promise((resolve, reject) => {
    if (API_URL) {
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action, data })
      }).then(r => r.json()).then(resolve).catch(reject);
    } else if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(str => { try { resolve(JSON.parse(str)); } catch(e) { reject(e); } })
        .withFailureHandler(reject)
        .callFromClient(JSON.stringify({ action, data }));
    } else {
      reject(new Error('ไม่พบช่องทางเชื่อมต่อ backend (ตั้งค่า API_URL)'));
    }
  });
}

/* ---------- LOGIN ---------- */
function doLogin() {
  const moduleKey = document.getElementById('loginModuleKey').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errBox = document.getElementById('loginErr');
  errBox.classList.add('hidden');

  callApi('login', { moduleKey, password }).then(res => {
    if (!res.ok) {
      errBox.textContent = res.error || 'เข้าสู่ระบบไม่สำเร็จ';
      errBox.classList.remove('hidden');
      return;
    }
    SESSION = res.session;
    localStorage.setItem('genapp_session', JSON.stringify(SESSION));
    enterApp();
  }).catch(err => {
    errBox.textContent = 'เชื่อมต่อไม่ได้: ' + err.message;
    errBox.classList.remove('hidden');
  });
}

function doLogout() {
  SESSION = null;
  localStorage.removeItem('genapp_session');
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

/* ---------- APP ENTRY ---------- */
function enterApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'block';
  document.getElementById('userName').textContent = SESSION.displayName;
  document.getElementById('userRole').textContent = SESSION.role.toUpperCase() + ' · ' + SESSION.buildingCode;
  buildNav();
  navigate(PRELOAD_GENID ? 'pmScan' : 'dashboard');
}

const NAV_ITEMS = [
  { key: 'dashboard', icon: '🏠', label: 'Dashboard' },
  { key: 'generators', icon: '⚙️', label: 'ทะเบียนเครื่อง + QR' },
  { key: 'pmWeekly', icon: '📋', label: 'PM รายสัปดาห์' },
  { key: 'pmAnnual', icon: '📅', label: 'PM รายปี / Load Test' },
  { key: 'fuel', icon: '⛽', label: 'บันทึกเชื้อเพลิง' },
  { key: 'fuelTank', icon: '🛢️', label: 'สถานะถังเชื้อเพลิง' },
  { key: 'repair', icon: '🔧', label: 'ประวัติซ่อมบำรุง' },
  { key: 'qrscan', icon: '📷', label: 'สแกน QR' },
  { key: 'export', icon: '📤', label: 'Export Excel' }
];

function buildNav() {
  const nav = document.getElementById('navList');
  nav.innerHTML = NAV_ITEMS.map(item =>
    `<div class="nav-item" data-key="${item.key}" onclick="navigate('${item.key}')">
       <span>${item.icon}</span><span>${item.label}</span>
     </div>`
  ).join('');
}

function setActiveNav(key) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.key === key);
  });
}

/* ---------- ROUTER ---------- */
function navigate(key) {
  CURRENT_PAGE = key;
  setActiveNav(key);
  document.getElementById('sidebar').classList.remove('open');
  const routes = {
    dashboard: renderDashboard,
    generators: renderGenerators,
    pmWeekly: () => renderPmForm('weekly'),
    pmAnnual: () => renderPmForm('annual'),
    fuel: renderFuel,
    fuelTank: renderFuelTank,
    repair: renderRepair,
    qrscan: renderQrScan,
    pmScan: renderPmFromScan,
    export: renderExport
  };
  (routes[key] || renderDashboard)();
}

function pageHeader(title, desc) {
  return `<div class="topbar"><div><div class="page-title">${title}</div><div class="page-desc">${desc||''}</div></div></div>`;
}

/* ---------- DASHBOARD ---------- */
let DASH_REPAIR_ROWS = [];
let DASH_COST_CHART = null;

function renderDashboard() {
  const el = document.getElementById('pageContent');
  el.innerHTML = pageHeader('Dashboard', 'ภาพรวมระบบเครื่องกำเนิดไฟฟ้า') + '<div class="loading">กำลังโหลด...</div>';

  Promise.all([
    callApi('getGeneratorMaster', {}),
    callApi('getFuelTankStatus', {}),
    callApi('getRepairHistory', {})
  ]).then(([genRes, tankRes, repairRes]) => {
    const genRows = genRes.rows || [];

    let html = pageHeader('Dashboard', 'ภาพรวมระบบเครื่องกำเนิดไฟฟ้า') + `
      <div class="grid-cards">
        <div class="stat-card"><div class="stat-num">${genRows.length}</div><div class="stat-label">เครื่องกำเนิดไฟฟ้าทั้งหมด</div></div>
        <div class="stat-card"><div class="stat-num">${SESSION.buildingCode}</div><div class="stat-label">อาคารที่เข้าถึงได้</div></div>
        <div class="stat-card"><div class="stat-num">${SESSION.role}</div><div class="stat-label">สิทธิ์การใช้งาน</div></div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="card-title">ทางลัด</div>
        <button class="btn small" onclick="navigate('qrscan')">📷 สแกน QR บันทึก PM</button>
        <button class="btn small ghost" onclick="navigate('generators')" style="margin-left:8px">⚙️ ดูทะเบียนเครื่อง</button>
        <button class="btn small ghost" onclick="navigate('fuel')" style="margin-left:8px">⛽ บันทึกเชื้อเพลิง</button>
      </div>`;

    /* ---- FUEL TANK STATUS ---- */
    html += renderFuelTankDashboard_(tankRes);

    /* ---- REPAIR COST CHART ---- */
    html += renderRepairCostSection_(repairRes);

    el.innerHTML = html;

    if (window.Chart && repairRes.ok && (repairRes.rows || []).length) {
      DASH_REPAIR_ROWS = repairRes.rows;
      initRepairFilters_(repairRes.headers || []);
      drawRepairChart_();
    }
  });
}

/* ---- Fuel Tank section ---- */
function renderFuelTankDashboard_(tankRes) {
  if (!tankRes.ok || !(tankRes.rows || []).length) {
    return `<div class="card"><div class="card-title">สถานะถังเชื้อเพลิง</div><div class="loading">ไม่มีข้อมูล</div></div>`;
  }
  const rows = tankRes.rows;
  const keys = Object.keys(rows[0]).filter(k => k !== '_row');
  const buildingKey = keys.find(k => /building|อาคาร/i.test(k));
  const nameKey = keys.find(k => /generator no|name|ชื่อ/i.test(k));
  const fullKey = keys.find(k => /^full/i.test(k));
  const p80Key = keys.find(k => /80/.test(k));
  const maxKey = keys.find(k => /max/i.test(k));
  const minKey = keys.find(k => /min/i.test(k));
  const actualKey = keys.find(k => /actual/i.test(k));
  const ropKey = keys.find(k => /rop/i.test(k));

  function statusOf(actual, min, max) {
    if (actual === '' || actual === null || isNaN(actual)) return null;
    if (min !== null && !isNaN(min) && actual <= min) return 'danger';
    if (max !== null && !isNaN(max) && actual <= max) return 'warn';
    return 'ok';
  }
  const statusLabel = { ok: '🟢 ปกติ', warn: '🟡 เฝ้าระวัง', danger: '🔴 ต้องสั่งเติมด่วน' };
  const statusClass = { ok: 'status-ok', warn: 'status-warn', danger: 'status-danger' };

  // สร้างเกจหลายสีตามค่าจริงของแต่ละถัง (Min/Max/80%/Full) + marker บอกตำแหน่งคงเหลือปัจจุบัน
  const ZONE_COLORS = ['#f85149', '#ff8c00', '#22c55e', '#2563eb']; // แดง-เหลือง-เขียว-น้ำเงิน เรียงจากน้อยไปมาก
  function buildGaugeHtml_(full, min, max, p80, actual) {
    if (!full || full <= 0) return '<div class="tank-sub">ไม่มีข้อมูลความจุ (Full Capacity)</div>';
    const pct = v => (isNaN(v) ? null : Math.max(0, Math.min(100, (v / full) * 100)));
    let bounds = [0, pct(min), pct(max), pct(p80), 100]
      .filter(v => v !== null && !isNaN(v))
      .sort((a, b) => a - b);
    // ตัดค่าซ้ำ (กรณี Max control = 80% Capacity พอดี)
    bounds = bounds.filter((v, i) => i === 0 || v - bounds[i - 1] > 0.01);
    if (bounds[0] > 0) bounds.unshift(0);
    if (bounds[bounds.length - 1] < 100) bounds.push(100);

    let zonesHtml = '', ticksHtml = '';
    for (let i = 0; i < bounds.length - 1; i++) {
      const width = bounds[i + 1] - bounds[i];
      const color = ZONE_COLORS[Math.min(i, ZONE_COLORS.length - 1)];
      zonesHtml += `<div class="gauge-zone" style="width:${width}%;background:${color}"></div>`;
    }
    bounds.forEach(b => {
      if (b === 0 || b === 100) return; // ไม่ต้องโชว์ tick หัวท้าย กันรก
      ticksHtml += `<span class="gauge-tick" style="left:${b}%">${Math.round(b)}%</span>`;
    });

    const actualPct = pct(actual);
    const marker = actualPct !== null ? `<div class="gauge-marker" style="left:${actualPct}%" title="คงเหลือ ${actual}"></div>` : '';

    return `<div class="gauge-wrap">
        <div class="gauge-zones">${zonesHtml}</div>
        ${marker}
      </div>
      <div class="gauge-ticks">${ticksHtml}</div>`;
  }

  function tankCardHtml(r, big) {
    const full = parseFloat(r[fullKey]) || 0;
    const p80 = p80Key ? parseFloat(r[p80Key]) : NaN;
    const actual = parseFloat(r[actualKey]);
    const min = parseFloat(r[minKey]);
    const max = parseFloat(r[maxKey]);
    const st = statusOf(actual, min, max) || 'ok';
    const name = r[nameKey] || r[buildingKey] || '-';
    return `<div class="tank-card${big ? ' big' : ''}">
      <div class="tank-name">${escHtml(name)} <span class="status-badge ${statusClass[st]}">${statusLabel[st]}</span></div>
      <div class="tank-sub">${escHtml(r[buildingKey] || '')}</div>
      ${buildGaugeHtml_(full, min, max, p80, actual)}
      <div class="tank-nums" style="margin-top:6px">
        <span>คงเหลือ: ${isNaN(actual) ? '-' : actual.toLocaleString()} L</span>
        <span>เต็ม: ${full.toLocaleString()} L</span>
      </div>
      ${ropKey ? `<div class="tank-nums"><span>ROP: ${r[ropKey]}</span><span></span></div>` : ''}
    </div>`;
  }

  const storeTanks = rows.filter(r => /store\s*tank/i.test(String(r[nameKey] || r[buildingKey] || '')));
  const genTanks = rows.filter(r => !storeTanks.includes(r));
  const alerts = rows.filter(r => {
    const actual = parseFloat(r[actualKey]);
    const min = parseFloat(r[minKey]);
    return !isNaN(actual) && !isNaN(min) && actual <= min;
  }).sort((a, b) => (parseFloat(a[actualKey]) - parseFloat(a[minKey])) - (parseFloat(b[actualKey]) - parseFloat(b[minKey])));

  let html = '<div class="card"><div class="card-title">🛢️ สถานะถังเชื้อเพลิงหลัก (Store Tank)</div>';
  html += storeTanks.length
    ? `<div class="grid-cards">${storeTanks.map(r => tankCardHtml(r, true)).join('')}</div>`
    : '<div class="loading">ไม่พบ Store Tank</div>';
  html += '</div>';

  if (alerts.length) {
    html += `<div class="card"><div class="card-title" style="color:var(--rose)">🔴 ต้องสั่งซื้อเชื้อเพลิงด่วน (${alerts.length} รายการ)</div>`;
    alerts.forEach(r => {
      const actual = parseFloat(r[actualKey]) || 0;
      const min = parseFloat(r[minKey]) || 0;
      html += `<div class="alert-row">
        <div><b>${escHtml(r[buildingKey] || '')}</b> — ${escHtml(r[nameKey] || '')}</div>
        <div style="font-size:12px">คงเหลือ ${actual.toLocaleString()} L / ขั้นต่ำ ${min.toLocaleString()} L
          <span style="color:var(--rose)">(ขาด ${(min - actual).toLocaleString()} L)</span></div>
      </div>`;
    });
    html += '</div>';
  }

  html += `<div class="card"><div class="card-title">สถานะถังเชื้อเพลิงแยกตามเครื่อง</div>
    <div class="grid-cards">${genTanks.map(r => tankCardHtml(r, false)).join('')}</div></div>`;

  return html;
}

function initRepairFilters_(headers) {

function parseCost_(v) {
  if (v === '' || v === null || v === undefined) return 0;
  const n = parseFloat(String(v).replace(/,/g, ''));
  return isNaN(n) ? 0 : n;
}

function drawRepairChart_() {
  const rows = DASH_REPAIR_ROWS;
  if (!rows.length || !window.Chart) return;
  const keys = Object.keys(rows[0]).filter(k => k !== '_row');
  const buildingKey = keys.find(k => /building|อาคาร/i.test(k));
  const typeKey = keys.find(k => /ประเภท|^type/i.test(k));
  const costKey = keys.find(k => /ราคา|cost|price/i.test(k));

  const bSel = document.getElementById('filterBuilding');
  const tSel = document.getElementById('filterType');
  const bVal = bSel ? bSel.value : '';
  const tVal = tSel ? tSel.value : '';

  let filtered = rows;
  if (bVal) filtered = filtered.filter(r => r[buildingKey] === bVal);
  if (tVal) filtered = filtered.filter(r => r[typeKey] === tVal);

  // จัดกลุ่มค่าใช้จ่ายรวมตาม Building x ประเภท (stacked bar) เพื่อวิเคราะห์ง่าย
  const buildings = [...new Set(filtered.map(r => r[buildingKey]).filter(Boolean))];
  const types = [...new Set(rows.map(r => r[typeKey]).filter(Boolean))];
  const colors = { 'งานบำรุงรักษา-MA': '#ff8c00', 'งานซ่อมแซม-CM': '#f85149', 'งานบำรุงรักษา-PM': '#22c55e' };
  const fallbackColors = ['#ff8c00', '#f85149', '#22c55e', '#a78bfa', '#2563eb'];

  const datasets = types.map((t, i) => ({
    label: t,
    data: buildings.map(b => filtered.filter(r => r[buildingKey] === b && r[typeKey] === t)
      .reduce((sum, r) => sum + parseCost_(r[costKey]), 0)),
    backgroundColor: colors[t] || fallbackColors[i % fallbackColors.length]
  }));

  const totalCost = filtered.reduce((sum, r) => sum + parseCost_(r[costKey]), 0);
  document.getElementById('costSummary').textContent =
    `รวม ${filtered.length} รายการ · ค่าใช้จ่ายรวม ${totalCost.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})} บาท`;

  const ctx = document.getElementById('repairCostChart').getContext('2d');
  if (DASH_COST_CHART) DASH_COST_CHART.destroy();
  DASH_COST_CHART = new Chart(ctx, {
    type: 'bar',
    data: { labels: buildings, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { stacked: true, ticks: { color: '#8a8580' }, grid: { color: 'rgba(255,140,0,.08)' } },
        y: { stacked: true, ticks: { color: '#8a8580' }, grid: { color: 'rgba(255,140,0,.08)' } }
      },
      plugins: { legend: { labels: { color: '#f0ede8' } } }
    }
  });
}

/* ---------- PM FORM (dynamic ตาม header จริงในชีต) ---------- */

// วิเคราะห์ header ว่าควรเป็น dropdown (มีตัวเลือกในวงเล็บ) หรือ text ปกติ (มี range เป็น hint)
function analyzeField_(header) {
  const m = header.match(/\(([^)]+)\)\s*$/); // จับวงเล็บสุดท้ายของ header
  if (!m) return { type: 'text', hint: '' };
  const content = m[1].trim();
  const hasDigit = /\d/.test(content);
  const hasSlash = content.indexOf('/') !== -1;

  // กรณีมีตัวเลข + ขีดกลาง เช่น "35-90 oC", "60-100 Psig", "24 - 30 Vdc." -> เป็นช่วงค่าอ้างอิง ไม่ใช่ dropdown
  if (hasDigit && !hasSlash) {
    return { type: 'text', hint: content };
  }
  // กรณีมี / และไม่ใช่ตัวเลขล้วน -> เป็นตัวเลือกให้เลือก (dropdown)
  if (hasSlash) {
    const opts = content.split('/').map(s => s.trim()).filter(Boolean);
    const looksLikeOptions = opts.length >= 2 && opts.length <= 6 && opts.every(o => o.length <= 25 && !/^\d+$/.test(o));
    if (looksLikeOptions) return { type: 'select', options: opts, hint: '' };
  }
  return { type: 'text', hint: content };
}

// จัดกลุ่ม header เป็นหมวดตามคำนำหน้า (Before/Running/After/Function/...) เพื่อลดอาการตาลาย
function groupOf_(header) {
  const h = header.toLowerCase();
  if (/^period$/i.test(header.trim())) return 'ข้อมูลทั่วไป';
  if (/^(company|building|code|date|อาคาร|บริษัท|รหัส|วันที่)/i.test(header)) return 'ข้อมูลทั่วไป';
  if (/^function|pm & emergency|pm&emergency/i.test(h)) return 'เงื่อนไขการทดสอบ (Function Test)';
  if (/^before\s*:/i.test(h)) return 'ก่อนทดสอบ (Before Test)';
  if (/^running\s*:|start running time|stop running time/i.test(h)) return 'ระหว่างทดสอบ (Running)';
  if (/^after\s*(test)?\s*:/i.test(h)) return 'หลังทดสอบ (After Test)';
  if (/test load|load generator|testing period|summarize/i.test(h)) return 'สรุปผล Load Test';
  if (/สภาพโดยทั่วไป|availability|ช่างผู้ทดสอบ|หัวหน้าตรวจสอบ|checked by|signature/i.test(h)) return 'สรุปผลตรวจ / ผู้บันทึก';
  return 'ข้อมูลอื่นๆ';
}

const PERIOD_OPTIONS = ['Week', 'Month', 'Quarter', 'Annual', 'Emergency', 'PM'];
let PM_GEN_MAP = {}; // code -> {company, building, code}

function renderPmForm(period, presetGenerator) {
  const el = document.getElementById('pageContent');
  const title = period === 'annual' ? 'PM รายปี / Load Test (NFPA110)' : 'PM รายสัปดาห์';
  el.innerHTML = pageHeader(title, 'บันทึกผลตรวจสอบเครื่องกำเนิดไฟฟ้า') + '<div class="loading">กำลังโหลดฟอร์ม...</div>';

  Promise.all([
    callApi('getPmRecords', { period, limit: 10 }),
    callApi('getGeneratorMaster', {})
  ]).then(([res, genRes]) => {
    if (!res.ok) { el.innerHTML += `<div class="err-msg">${res.error}</div>`; return; }
    const headers = (res.headers || []).filter(h => h);
    const skipPatterns = /^(Result|ผลลัพท์)/i; // ซ่อนคอลัมน์ผลลัพท์อัตโนมัติ (เติมค่า 1 อัตโนมัติ ไม่ต้องกรอก)

    // เตรียม dropdown เลือกเครื่องกำเนิดไฟฟ้า (auto-fill Company/Building/Code)
    let genPickerHtml = '';
    PM_GEN_MAP = {};
    if (genRes.ok && (genRes.rows || []).length) {
      const rows = genRes.rows;
      const companyKey = Object.keys(rows[0]).find(k => /company|บริษัท/i.test(k) && k !== '_row');
      const buildingKey = Object.keys(rows[0]).find(k => /building|อาคาร/i.test(k) && k !== '_row');
      const codeKey = Object.keys(rows[0]).find(k => /^code/i.test(k) && !/machine/i.test(k) && k !== '_row');
      const nameKey = Object.keys(rows[0]).find(k => /name|ชื่อ/i.test(k) && k !== '_row');

      let options = '<option value="">— เลือกเครื่องกำเนิดไฟฟ้า —</option>';
      rows.forEach(r => {
        const code = codeKey ? r[codeKey] : '';
        if (!code) return;
        PM_GEN_MAP[code] = {
          company: companyKey ? r[companyKey] : '',
          building: buildingKey ? r[buildingKey] : '',
          code: code
        };
        const label = `${r[buildingKey] || ''} · ${r[nameKey] || ''} (${code})`;
        const selected = presetGenerator && String(presetGenerator[codeKey]) === String(code) ? ' selected' : '';
        options += `<option value="${escAttr(code)}"${selected}>${escHtml(label)}</option>`;
      });

      genPickerHtml = `<div class="card">
        <div class="card-title">เลือกเครื่องกำเนิดไฟฟ้า</div>
        <div class="field" style="max-width:420px">
          <select id="pmGenPicker" onchange="applyGenPreset(this)">${options}</select>
        </div>
      </div>`;
    }

    // จัดกลุ่ม header ตามลำดับที่เจอครั้งแรก
    const groups = {}; // { groupName: [header, ...] }
    const groupOrder = [];
    headers.forEach(h => {
      if (skipPatterns.test(h)) return;
      const g = groupOf_(h);
      if (!groups[g]) { groups[g] = []; groupOrder.push(g); }
      groups[g].push(h);
    });

    let formHtml = '';
    groupOrder.forEach(g => {
      formHtml += `<div class="card"><div class="card-title">${escHtml(g)}</div><div class="form-grid">`;
      groups[g].forEach(h => {
        const inputId = 'pmf_' + cssId(h);
        let preset = '';
        if (presetGenerator) {
          if (/building|อาคาร/i.test(h)) preset = presetGenerator[Object.keys(presetGenerator).find(k=>/building|อาคาร/i.test(k))] || '';
          if (/^code|รหัสเครื่องจักร/i.test(h)) preset = presetGenerator[Object.keys(presetGenerator).find(k=>/^code|รหัสเครื่องจักร/i.test(k))] || '';
          if (/company|บริษัท/i.test(h)) preset = presetGenerator[Object.keys(presetGenerator).find(k=>/company|บริษัท/i.test(k))] || '';
        }

        if (/^period$/i.test(h.trim())) {
          formHtml += `<div class="field"><label>${escHtml(h)}</label>
            <select id="${inputId}" data-header="${escAttr(h)}">
              <option value=""></option>
              ${PERIOD_OPTIONS.map(o => `<option value="${o}">${o}</option>`).join('')}
            </select></div>`;
          return;
        }

        // ช่องวันที่ -> ใช้ date picker ของ browser แล้วแปลงเป็น dd/mm/yyyy ตอนบันทึก
        if (/^date$|วันที่/i.test(h.trim()) && !/update|start|stop|finish/i.test(h)) {
          const todayIso = new Date().toISOString().slice(0, 10);
          formHtml += `<div class="field"><label>${escHtml(h)}</label>
            <input type="date" id="${inputId}" data-header="${escAttr(h)}" data-type="date" value="${todayIso}"></div>`;
          return;
        }

        const analysis = analyzeField_(h);
        if (analysis.type === 'select') {
          formHtml += `<div class="field"><label>${escHtml(h)}</label>
            <select id="${inputId}" data-header="${escAttr(h)}">
              <option value=""></option>
              ${analysis.options.map(o => `<option value="${escAttr(o)}">${escHtml(o)}</option>`).join('')}
            </select></div>`;
        } else {
          const hintAttr = analysis.hint ? ` placeholder="เช่น ${escAttr(analysis.hint)}"` : '';
          formHtml += `<div class="field"><label>${escHtml(h)}</label>
            <input id="${inputId}" data-header="${escAttr(h)}" value="${escAttr(preset)}"${hintAttr}></div>`;
        }
      });
      formHtml += '</div></div>';
    });

    formHtml = `<div id="pmFormWrap">${genPickerHtml}${formHtml}
      <div class="card">
        <button class="btn" onclick="submitPm('${period}')">✓ บันทึกข้อมูล</button>
        <span id="pmSubmitMsg" style="margin-left:12px;font-size:12px"></span>
      </div>
    </div>`;

    // ตารางประวัติล่าสุด
    let tableHtml = '<div class="card"><div class="card-title">รายการล่าสุด (10 รายการ)</div><div class="table-wrap"><table><thead><tr>';
    headers.slice(0, 8).forEach(h => tableHtml += `<th>${escHtml(h)}</th>`);
    tableHtml += '</tr></thead><tbody>';
    (res.rows || []).forEach(r => {
      tableHtml += '<tr>';
      headers.slice(0, 8).forEach(h => tableHtml += `<td>${escHtml(r[h] ?? '')}</td>`);
      tableHtml += '</tr>';
    });
    tableHtml += '</tbody></table></div></div>';

    el.innerHTML = pageHeader(title, 'บันทึกผลตรวจสอบเครื่องกำเนิดไฟฟ้า') + formHtml + tableHtml;
  });
}

// เรียกเมื่อผู้ใช้เลือกเครื่องจาก dropdown "เลือกเครื่องกำเนิดไฟฟ้า" -> auto-fill Company/Building/Code
function applyGenPreset(selectEl) {
  const code = selectEl.value;
  const wrap = document.getElementById('pmFormWrap');
  if (!code || !PM_GEN_MAP[code]) return;
  const info = PM_GEN_MAP[code];
  const wrapFields = wrap.querySelectorAll('[data-header]');
  wrapFields.forEach(el => {
    const h = el.dataset.header;
    if (/company|บริษัท/i.test(h)) el.value = info.company;
    else if (/building|อาคาร/i.test(h)) el.value = info.building;
    else if (/^code|รหัสเครื่องจักร/i.test(h)) el.value = info.code;
  });
}

function submitPm(period) {
  const wrap = document.getElementById('pmFormWrap');
  const fields = wrap.querySelectorAll('input[data-header], select[data-header]');
  const values = {};
  let buildingCode = '';
  fields.forEach(inp => {
    let val = inp.value;
    if (inp.dataset.type === 'date' && val) {
      // input type=date ให้ค่าแบบ yyyy-mm-dd -> แปลงเป็น dd/mm/yyyy ให้ตรงกับข้อมูลเดิมในชีต
      const [y, m, d] = val.split('-');
      val = `${d}/${m}/${y}`;
    }
    values[inp.dataset.header] = val;
    if (/building|อาคาร/i.test(inp.dataset.header)) buildingCode = val;
  });
  const msg = document.getElementById('pmSubmitMsg');
  msg.textContent = 'กำลังบันทึก...';
  callApi('submitPmRecord', { period, buildingCode, values }).then(res => {
    msg.textContent = res.ok ? '✓ บันทึกสำเร็จ' : ('✕ ' + res.error);
    msg.style.color = res.ok ? 'var(--green)' : 'var(--rose)';
    if (res.ok) setTimeout(() => renderPmForm(period), 1200);
  });
}

/* ---------- FUEL LOG ---------- */
function renderFuel() {
  const el = document.getElementById('pageContent');
  el.innerHTML = pageHeader('บันทึกเชื้อเพลิง', 'Weekly Test Run / Refuel / Emergency Use') + '<div class="loading">กำลังโหลด...</div>';
  callApi('getFuelLog', { limit: 15 }).then(res => {
    if (!res.ok) { el.innerHTML += `<div class="err-msg">${res.error}</div>`; return; }
    const headers = (res.headers || []).filter(h => h && h !== 'No.');
    let formHtml = `<div class="card"><div class="card-title">บันทึกใหม่</div><div class="form-grid" id="fuelFormGrid">`;
    headers.forEach(h => {
      if (/^date$|วันที่/i.test(h.trim())) {
        const todayIso = new Date().toISOString().slice(0, 10);
        formHtml += `<div class="field"><label>${escHtml(h)}</label><input type="date" id="ff_${cssId(h)}" data-header="${escAttr(h)}" data-type="date" value="${todayIso}"></div>`;
      } else {
        formHtml += `<div class="field"><label>${escHtml(h)}</label><input id="ff_${cssId(h)}" data-header="${escAttr(h)}"></div>`;
      }
    });
    formHtml += `</div><button class="btn" style="margin-top:14px" onclick="submitFuel()">✓ บันทึก</button>
      <span id="fuelSubmitMsg" style="margin-left:12px;font-size:12px"></span></div>`;

    let tableHtml = '<div class="card"><div class="card-title">ประวัติล่าสุด</div><div class="table-wrap"><table><thead><tr>';
    headers.forEach(h => tableHtml += `<th>${escHtml(h)}</th>`);
    tableHtml += '</tr></thead><tbody>';
    (res.rows || []).forEach(r => {
      tableHtml += '<tr>';
      headers.forEach(h => tableHtml += `<td>${escHtml(r[h] ?? '')}</td>`);
      tableHtml += '</tr>';
    });
    tableHtml += '</tbody></table></div></div>';

    el.innerHTML = pageHeader('บันทึกเชื้อเพลิง', 'Weekly Test Run / Refuel / Emergency Use') + formHtml + tableHtml;
  });
}

function submitFuel() {
  const grid = document.getElementById('fuelFormGrid');
  const inputs = grid.querySelectorAll('input');
  const values = {}; let buildingCode = '';
  inputs.forEach(inp => {
    let val = inp.value;
    if (inp.dataset.type === 'date' && val) {
      const [y, m, d] = val.split('-');
      val = `${d}/${m}/${y}`;
    }
    values[inp.dataset.header] = val;
    if (/building|อาคาร/i.test(inp.dataset.header)) buildingCode = val;
  });
  const msg = document.getElementById('fuelSubmitMsg');
  msg.textContent = 'กำลังบันทึก...';
  callApi('submitFuelLog', { buildingCode, values }).then(res => {
    msg.textContent = res.ok ? '✓ บันทึกสำเร็จ' : ('✕ ' + res.error);
    msg.style.color = res.ok ? 'var(--green)' : 'var(--rose)';
    if (res.ok) setTimeout(renderFuel, 1200);
  });
}

/* ---------- EXPORT ---------- */
function renderExport() {
  const modules = [
    { key: 'GEN_MASTER', label: 'ทะเบียนเครื่องกำเนิดไฟฟ้า' },
    { key: 'PM_WEEKLY', label: 'PM รายสัปดาห์' },
    { key: 'PM_ANNUAL', label: 'PM รายปี / Load Test' },
    { key: 'FUEL_LOG', label: 'บันทึกเชื้อเพลิง' },
    { key: 'FUEL_TANK', label: 'สถานะถังเชื้อเพลิง' },
    { key: 'REPAIR_HISTORY', label: 'ประวัติซ่อมบำรุง' }
  ];
  const el = document.getElementById('pageContent');
  el.innerHTML = pageHeader('Export Excel', 'ดาวน์โหลดข้อมูลแต่ละ module เป็นไฟล์ .xlsx') +
    '<div class="card">' + modules.map(m =>
      `<div style="margin-bottom:10px">
        <button class="btn small" onclick="doExport('${m.key}', this)">📤 ${m.label}</button>
       </div>`
    ).join('') + '</div>';
}

function doExport(moduleKey, btn) {
  const original = btn.textContent;
  btn.textContent = 'กำลังสร้างไฟล์...';
  btn.disabled = true;
  callApi('exportExcel', { module: moduleKey }).then(res => {
    btn.textContent = original;
    btn.disabled = false;
    if (!res.ok) { alert('Export ล้มเหลว: ' + res.error); return; }
    const link = document.createElement('a');
    link.href = 'data:' + res.mimeType + ';base64,' + res.base64;
    link.download = res.fileName;
    link.click();
  }).catch(err => {
    btn.textContent = original; btn.disabled = false;
    alert('เกิดข้อผิดพลาด: ' + err.message);
  });
}

/* ---------- UTIL ---------- */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- AUTO LOGIN (ถ้ามี session เดิม) ---------- */
(function init() {
  const saved = localStorage.getItem('genapp_session');
  if (saved) {
    try {
      SESSION = JSON.parse(saved);
      enterApp();
    } catch(e) { localStorage.removeItem('genapp_session'); }
  }
})();
