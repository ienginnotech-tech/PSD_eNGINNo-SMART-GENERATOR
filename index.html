    el.innerHTML = pageHeader('ประวัติซ่อมบำรุง', (res.rows||[]).length + ' รายการ') + tableHtml;
  }).catch(err => {
    el.innerHTML = pageHeader('ประวัติซ่อมบำรุง', '') + `<div class="card err-msg">เชื่อมต่อไม่ได้: ${escHtml(err.message)}
      <button class="btn small ghost" onclick="renderRepair()" style="margin-left:8px">ลองใหม่</button></div>`;
  });
}

/* ---------- EXPORT ---------- */
function renderExport() {
  const modules = [
    { key: 'GEN_MASTER', label: 'ทะเบียนเครื่องกำเนิดไฟฟ้า' },
    { key: 'PM_WEEKLY', label: 'PM รายสัปดาห์' },
    { key: 'PM_ANNUAL', label: 'PM รายปี / Load Test' },
    { key: 'FUEL_LOG', label: 'บันทึกเชื้อเพลิง' },
    { key: 'FUEL_TANK', label: 'สถานะถังเชื้อเพลิง' },
    { key: 'REPAIR_HISTORY', label: 'ประวัติซ่อมบำรุง' }
  ];
  const el = document.getElementById('pageContent');
  el.innerHTML = pageHeader('Export Excel', 'ดาวน์โหลดข้อมูลแต่ละ module เป็นไฟล์ .xlsx') +
    '<div class="card">' + modules.map(m =>
      `<div style="margin-bottom:10px">
        <button class="btn small" onclick="doExport('${m.key}', this)">📤 ${m.label}</button>
       </div>`
    ).join('') + '</div>';
}

function doExport(moduleKey, btn) {
  const original = btn.textContent;
  btn.textContent = 'กำลังสร้างไฟล์...';
  btn.disabled = true;
  callApi('exportExcel', { module: moduleKey }).then(res => {
    btn.textContent = original;
    btn.disabled = false;
    if (!res.ok) { alert('Export ล้มเหลว: ' + res.error); return; }
    const link = document.createElement('a');
    link.href = 'data:' + res.mimeType + ';base64,' + res.base64;
    link.download = res.fileName;
    link.click();
  }).catch(err => {
    btn.textContent = original; btn.disabled = false;
    alert('เกิดข้อผิดพลาด: ' + err.message);
  });
}

/* ---------- SETTINGS ---------- */
const THEME_PRESETS = {
  orange: { name: 'Dark (Default)', accent: '#ff8c00', accent2: '#e67e00', border: 'rgba(255,140,0,.12)', border2: 'rgba(255,140,0,.22)', bar: 'linear-gradient(90deg,#ff8c00,#e67e00)' },
  gray:   { name: 'Gray', accent: '#9ca3af', accent2: '#6b7280', border: 'rgba(156,163,175,.14)', border2: 'rgba(156,163,175,.26)', bar: 'linear-gradient(90deg,#9ca3af,#6b7280)' },
  blue:   { name: 'Blue', accent: '#2563eb', accent2: '#1d4ed8', border: 'rgba(37,99,235,.14)', border2: 'rgba(37,99,235,.28)', bar: 'linear-gradient(90deg,#2563eb,#1d4ed8)' }
};
const FONT_SIZE_PRESETS = {
  small:  { name: 'เล็ก', zoom: 0.9 },
  normal: { name: 'ปกติ', zoom: 1 },
  large:  { name: 'ใหญ่', zoom: 1.15 },
  xlarge: { name: 'ใหญ่มาก', zoom: 1.3 }
};
const FONT_PRESETS = {
  courier: { name: 'Courier New', family: "'Courier New',Courier,monospace", googleFont: null },
  sarabun: { name: 'Sarabun (ไทย)', family: "'Sarabun',sans-serif", googleFont: 'Sarabun:wght@400;700' },
  orbitron:{ name: 'Orbitron', family: "'Orbitron',sans-serif", googleFont: 'Orbitron:wght@400;700' }
};

function loadSettings_() {
  try { return JSON.parse(localStorage.getItem('genapp_settings')) || {}; } catch(e) { return {}; }
}
function saveSettings_(s) { localStorage.setItem('genapp_settings', JSON.stringify(s)); }

function applySettings_() {
  const s = loadSettings_();
  const theme = THEME_PRESETS[s.theme] || THEME_PRESETS.orange;
  document.documentElement.style.setProperty('--accent', theme.accent);
  document.documentElement.style.setProperty('--accent2', theme.accent2);
  document.documentElement.style.setProperty('--accent-glow', theme.accent + '30');
  document.documentElement.style.setProperty('--border', theme.border);
  document.documentElement.style.setProperty('--border2', theme.border2);

  const font = FONT_PRESETS[s.font] || FONT_PRESETS.courier;
  if (font.googleFont && !document.getElementById('gfont-link')) {
    const link = document.createElement('link');
    link.id = 'gfont-link'; link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=' + font.googleFont + '&display=swap';
    document.head.appendChild(link);
  }
  document.documentElement.style.setProperty('--font', font.family);

  const fontSize = FONT_SIZE_PRESETS[s.fontSize] || FONT_SIZE_PRESETS.normal;
  document.body.style.zoom = fontSize.zoom; // รองรับ Chrome/Edge/Safari รุ่นใหม่ - เบราว์เซอร์อื่นอาจไม่รองรับ zoom

  const sidebar = document.getElementById('sidebar');
  if (sidebar) sidebar.classList.toggle('compact', !!s.compactSidebar);
}

function renderSettings() {
  const s = loadSettings_();
  const el = document.getElementById('pageContent');
  let html = pageHeader('⚙️ ตั้งค่า (Settings)', 'ปรับแต่งธีม ฟอนต์ และรูปแบบการแสดงผล');

  html += `<div class="card"><div class="card-title">🎨 เลือก Theme</div><div class="option-grid">`;
  Object.keys(THEME_PRESETS).forEach(key => {
    const t = THEME_PRESETS[key];
    const active = (s.theme || 'orange') === key ? ' active' : '';
    html += `<div class="theme-swatch${active}" onclick="setSetting_('theme','${key}')">
      <div class="theme-swatch-bar" style="background:${t.bar}"></div>${t.name}</div>`;
  });
  html += `</div></div>`;

  html += `<div class="card"><div class="card-title">🔤 Font / ตัวอักษร</div><div class="option-grid">`;
  Object.keys(FONT_PRESETS).forEach(key => {
    const f = FONT_PRESETS[key];
    const active = (s.font || 'courier') === key ? ' active' : '';
    html += `<div class="theme-swatch${active}" style="font-family:${f.family}" onclick="setSetting_('font','${key}')">Aa<br>${f.name}</div>`;
  });
  html += `</div></div>`;

  html += `<div class="card"><div class="card-title">🔍 ขนาดตัวอักษร</div><div class="option-grid">`;
  Object.keys(FONT_SIZE_PRESETS).forEach(key => {
    const fs = FONT_SIZE_PRESETS[key];
    const active = (s.fontSize || 'normal') === key ? ' active' : '';
    html += `<div class="theme-swatch${active}" style="font-size:${14 * fs.zoom}px" onclick="setSetting_('fontSize','${key}')">Aa<br><span style="font-size:11px">${fs.name}</span></div>`;
  });
  html += `<div style="grid-column:1/-1;font-size:11px;color:var(--text2)">* ปรับขนาดทั้งแอปพร้อมกัน รองรับ Chrome/Edge/Safari รุ่นใหม่</div></div>`;

  html += `<div class="card"><div class="card-title">🌐 ภาษา / Language</div>
    <select id="settingsLang" style="max-width:240px" onchange="setSetting_('lang', this.value)">
      <option value="th" ${(!s.lang || s.lang==='th') ? 'selected' : ''}>ไทย (Thai)</option>
      <option value="en" ${s.lang==='en' ? 'selected' : ''}>English</option>
    </select>
    <div style="font-size:11px;color:var(--text2);margin-top:8px">
      * ระบบจะสลับภาษาของเมนูหลักให้ ส่วนข้อมูลจากชีต (ชื่อคอลัมน์/รายการ) ยังคงแสดงตามที่บันทึกไว้จริงในชีตเสมอ
    </div></div>`;

  html += `<div class="card"><div class="card-title">📐 Sidebar</div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
      <input type="checkbox" id="compactToggle" ${s.compactSidebar ? 'checked' : ''} onchange="setSetting_('compactSidebar', this.checked)">
      Compact Mode (ย่อ Sidebar ให้เล็กลง)
    </label></div>`;

  el.innerHTML = html;
}

function setSetting_(key, value) {
  const s = loadSettings_();
  s[key] = value;
  saveSettings_(s);
  applySettings_();
  if (key === 'lang') applyLanguage_();
  renderSettings(); // re-render เพื่ออัปเดต active state ของ swatch
}

/* ---------- LANGUAGE (partial: สลับเฉพาะเมนูหลัก/หัวข้อ ไม่แตะข้อมูลจากชีต) ---------- */
const NAV_LABELS_EN = {
  'DASHBOARD MONITOR': 'DASHBOARD MONITOR',
  'WEEKLY TEST': 'WEEKLY TEST',
  'ANNUAL & EMERGENCY LOAD TEST': 'ANNUAL & EMERGENCY LOAD TEST'
};
function applyLanguage_() {
  // โครงสร้างเมนูเป็นภาษาอังกฤษอยู่แล้วตามที่ออกแบบไว้ ส่วนหัวข้อหน้า/ปุ่มหลักจะสลับผ่าน dict นี้ในอนาคตได้
  // ปัจจุบัน sidebar labels เป็น EN-first ตามสเปกที่กำหนดไว้แล้ว จึงไม่ต้องแปลซ้ำ
}
/* ---------- USER AUTHORIZE (Admin Management) ---------- */
function renderUserAuthorize() {
  const el = document.getElementById('pageContent');
  el.innerHTML = pageHeader('🗝️ User Authorize', 'อนุมัติ / แก้ไข / ยกเลิกสิทธิ์ผู้ใช้งานแต่ละอาคาร') + '<div class="loading">กำลังโหลด...</div>';

  callApi('listUsers', {}).then(res => {
    if (!res.ok) { el.innerHTML = pageHeader('🗝️ User Authorize', '') + `<div class="card err-msg">${escHtml(res.error)}</div>`; return; }
    const rows = res.rows || [];
    const statusLabel = { pending: '🟠 รออนุมัติ', approved: '🟢 อนุมัติแล้ว', rejected: '🔴 ปฏิเสธ/ยกเลิก' };
    const statusClassMap = { pending: 'user-status-pending', approved: 'user-status-approved', rejected: 'user-status-rejected' };

    let html = pageHeader('🗝️ User Authorize', rows.length + ' บัญชีทั้งหมด') + '<div class="card"><div class="table-wrap"><table><thead><tr>';
    html += ['ชื่อ','Module Key','อาคาร','สิทธิ์','สถานะ','วันที่สมัคร','จัดการ'].map(h => `<th>${h}</th>`).join('');
    html += '</tr></thead><tbody>';
    rows.forEach(r => {
      html += `<tr>
        <td>${escHtml(r.displayName)}</td>
        <td>${escHtml(r.moduleKey)}</td>
        <td>${escHtml(r.buildingCode)}</td>
        <td>${escHtml(r.role)}</td>
        <td class="${statusClassMap[r.status] || ''}">${statusLabel[r.status] || r.status}</td>
        <td>${escHtml(r.createdAt)}</td>
        <td class="user-actions">
          ${r.status !== 'approved' ? `<button class="btn small" onclick="userAction_('approveUser', ${r._row})">✓ อนุมัติ</button>` : ''}
          ${r.status !== 'rejected' ? `<button class="btn small ghost" onclick="userAction_('rejectUser', ${r._row})">✕ ปฏิเสธ</button>` : ''}
          <button class="btn small ghost" onclick="editUser_(${r._row}, '${escAttr(r.displayName)}', '${escAttr(r.moduleKey)}', '${escAttr(r.buildingCode)}', '${escAttr(r.role)}')">✎ แก้ไข</button>
          <button class="btn small ghost" onclick="userAction_('deleteUser', ${r._row}, true)">🗑 ลบ</button>
        </td>
      </tr>`;
    });
    html += '</tbody></table></div></div>';
    html += `<div id="editUserPanel"></div>`;
    el.innerHTML = html;
  }).catch(err => {
    el.innerHTML = pageHeader('🗝️ User Authorize', '') + `<div class="card err-msg">เชื่อมต่อไม่ได้: ${escHtml(err.message)}
      <button class="btn small ghost" onclick="renderUserAuthorize()" style="margin-left:8px">ลองใหม่</button></div>`;
  });
}

function userAction_(action, row, confirmFirst) {
  if (confirmFirst && !confirm('ยืนยันการลบผู้ใช้นี้ถาวร?')) return;
  callApi(action, { row }).then(res => {
    if (!res.ok) { alert(res.error); return; }
    renderUserAuthorize();
  });
}

function editUser_(row, displayName, moduleKey, buildingCode, role) {
  const panel = document.getElementById('editUserPanel');
  panel.innerHTML = `<div class="card">
    <div class="card-title">แก้ไขผู้ใช้: ${escHtml(displayName)}</div>
    <div class="form-grid">
      <div class="field"><label>ชื่อที่แสดง</label><input id="eu_name" value="${escAttr(displayName)}"></div>
      <div class="field"><label>Module Key</label><input id="eu_key" value="${escAttr(moduleKey)}"></div>
      <div class="field"><label>อาคาร</label><input id="eu_building" value="${escAttr(buildingCode)}"></div>
      <div class="field"><label>สิทธิ์ (role)</label>
        <select id="eu_role">
          <option value="engineer" ${role==='engineer'?'selected':''}>engineer</option>
          <option value="viewer" ${role==='viewer'?'selected':''}>viewer</option>
          <option value="admin" ${role==='admin'?'selected':''}>admin</option>
        </select></div>
      <div class="field"><label>Password ใหม่ (เว้นว่างถ้าไม่เปลี่ยน)</label>
        <div class="pw-wrap">
          <input id="eu_password" type="password">
          <button type="button" class="pw-toggle" onclick="togglePw_('eu_password', this)">👁️</button>
        </div>
      </div>
    </div>
    <button class="btn small" style="margin-top:10px" onclick="saveEditUser_(${row})">💾 บันทึก</button>
    <button class="btn small ghost" style="margin-top:10px" onclick="document.getElementById('editUserPanel').innerHTML=''">ยกเลิก</button>
  </div>`;
  panel.scrollIntoView({ behavior: 'smooth' });
}

function saveEditUser_(row) {
  const payload = {
    row,
    displayName: document.getElementById('eu_name').value,
    moduleKey: document.getElementById('eu_key').value,
    buildingCode: document.getElementById('eu_building').value,
    role: document.getElementById('eu_role').value,
    password: document.getElementById('eu_password').value
  };
  callApi('updateUser', payload).then(res => {
    if (!res.ok) { alert(res.error); return; }
    renderUserAuthorize();
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- AUTO LOGIN (ถ้ามี session เดิม) ---------- */
(function init() {
  applySettings_(); // โหลดธีม/ฟอนต์ที่ผู้ใช้ตั้งไว้ก่อน แม้ยังไม่ login
  const saved = localStorage.getItem('genapp_session');
  if (saved) {
    try {
      SESSION = JSON.parse(saved);
      enterApp();
    } catch(e) { localStorage.removeItem('genapp_session'); }
  }
})();
</script>
